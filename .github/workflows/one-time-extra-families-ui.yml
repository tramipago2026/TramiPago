name: One-time extra families UI

on:
  push:
    paths:
      - '.github/workflows/one-time-extra-families-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate extra families and intake-only UX
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # 1) Load extra families before app.js and search index.
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          old='  <script src="arca-family.js?v=20260909-clean-final"></script>\n'
          new=old+'  <script src="extra-families.js?v=20260915-families1"></script>\n'
          if 'extra-families.js' not in text:
              if old not in text: raise SystemExit('index anchor not found')
              text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')

          # 2) Intake-only services do not show an unconfirmed commercial price.
          p=Path('app.js')
          text=p.read_text(encoding='utf-8')
          text=text.replace(
              '          <div class="service-card-mini">${renderPriceOptions(service)}</div>\n',
              '          ${service.intakeOnly ? "" : `<div class="service-card-mini">${renderPriceOptions(service)}</div>`}\n',
              1
          )

          # 3) Intake-only services use a two-step flow instead of showing a Payment step.
          old='''  function renderStepper(service) {\n    if (["correction", "ineligible"].includes(state.step)) return "";\n    const steps = [["data", "Datos"], ["payment", "Pago"], ["confirmation", "Finalización"]];\n    const visibleStep = state.step === "eligibility" ? "data" : state.step;\n    const currentIndex = steps.findIndex(([id, label]) => id === visibleStep);\n    if (currentIndex < 0) return "";\n    const completedFlow = visibleStep === "confirmation";\n\n    return `\n      <div class="stepper${completedFlow ? " is-complete" : ""}" style="grid-template-columns:repeat(3,1fr)" aria-label="Progreso del trámite">'''
          new='''  function renderStepper(service) {\n    if (["correction", "ineligible"].includes(state.step)) return "";\n    const steps = service.intakeOnly\n      ? [["data", "Datos"], ["confirmation", "Consulta"]]\n      : [["data", "Datos"], ["payment", "Pago"], ["confirmation", "Finalización"]];\n    const visibleStep = state.step === "eligibility" ? "data" : state.step;\n    const currentIndex = steps.findIndex(([id, label]) => id === visibleStep);\n    if (currentIndex < 0) return "";\n    const completedFlow = visibleStep === "confirmation";\n\n    return `\n      <div class="stepper${completedFlow ? " is-complete" : ""}" style="grid-template-columns:repeat(${steps.length},1fr)" aria-label="Progreso del trámite">'''
          if old not in text: raise SystemExit('renderStepper anchor not found')
          text=text.replace(old,new,1)

          # 4) In the summary, intake-only entries show confirmed official cost only, not TramiPago price placeholder.
          pattern=re.compile(r'''        <div class="service-summary-block">\n          <h3>Precio y plazo</h3>\n          \$\{renderPriceOptions\(service\)\}\n          \$\{service\.officialFee !== null && service\.officialFee !== undefined\n            \? `<div class="service-summary-row"><span>Costo oficial</span><strong>\$\{formatARS\(service\.officialFee\)\}</strong></div>`\n            : ""\}\n        </div>''')
          repl='''        ${service.intakeOnly\n          ? (service.officialFee !== null && service.officialFee !== undefined\n              ? `<div class="service-summary-block"><h3>Costo oficial</h3><div class="service-summary-row"><span>Arancel del organismo</span><strong>${formatARS(service.officialFee)}</strong></div></div>`\n              : "")\n          : `<div class="service-summary-block">\n              <h3>Precio y plazo</h3>\n              ${renderPriceOptions(service)}\n              ${service.officialFee !== null && service.officialFee !== undefined\n                ? `<div class="service-summary-row"><span>Costo oficial</span><strong>${formatARS(service.officialFee)}</strong></div>`\n                : ""}\n            </div>`}'''
          text,n=pattern.subn(repl,text,count=1)
          if n!=1: raise SystemExit(f'summary replacement count={n}')
          p.write_text(text,encoding='utf-8')

          # 5) Edge create-request now returns the real request UUID; retain it locally.
          p=Path('backend-sync.js')
          text=p.read_text(encoding='utf-8')
          text=text.replace(
              'meta={raw:data.requestToken,code:data.code,serverId:null,lastSignature:"",paymentUploaded:false,files:{}};',
              'meta={raw:data.requestToken,code:data.code,serverId:data.requestId||null,lastSignature:"",paymentUploaded:false,files:{}};',
              1
          )
          text=text.replace('request.serverId=null;','request.serverId=data.requestId||null;',1)
          p.write_text(text,encoding='utf-8')

          # Remove this one-time workflow after it has done its job.
          Path('.github/workflows/one-time-extra-families-ui.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app.js backend-sync.js .github/workflows/one-time-extra-families-ui.yml
          git commit -m 'Integra legalizaciones y atención de abogado'
          git push