name: Auditar enlaces, botones y diseño en navegador aislado
on:
  push:
    branches:
      - work/tramipago-v1-audit-20260920
    paths:
      - .github/workflows/v1-all-buttons-browser.yml
      - tests/v1-all-buttons-browser.mjs
      - tests/v1-new-links-design.mjs
      - legalizaciones-fotos-20260918.css
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador de prueba aislado
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Comprobar los 23 trámites y ayudas contextuales sin envíos
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/tramipago-browser.log 2>&1 &
          node tests/v1-all-buttons-browser.mjs
      - name: Comprobar CTA visibles, bordes, submenús, destinos y formularios PC/móvil
        run: node tests/v1-new-links-design.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tramipago-v1-botones-diseno
          path: audit-artifacts/
          if-no-files-found: warn
          retention-days: 14
