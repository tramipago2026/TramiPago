name: TEMP CONTROL3 Estado Civil real v2
on:
  push:
    branches:
      - control3-estado-civil-e2e-20261007
    paths:
      - "tests/control3-estado-civil-live-temp-v2.mjs"
      - ".github/workflows/control3-estado-civil-live-temp-v2.yml"
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: node tests/control3-estado-civil-live-temp-v2.mjs
