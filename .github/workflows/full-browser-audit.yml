name: Auditoría práctica completa TramiPago

on:
  push:
    paths:
      - "tests/full-browser-audit.mjs"
      - "tests/admin-browser-audit.mjs"
      - "admin/**"
      - "app.js"
      - "site-fixes.js"
      - "backend-sync.js"
      - "security-hardening.js"
      - "whatsapp-context.js"
      - "catalog-search.js"
      - "flow-ui.js"
      - "footer-menu.js"
      - "index.html"
      - "services.js"
      - "promos.js"
      - "assets/promo-tramite-online-20260930.webp"
      - "site.css"
      - "ui.css"
      - "shared-site-shell.css"
      - "tramites.html"
      - "municipales.html"
      - "contacto.html"
      - "opiniones.html"
      - "arrepentimiento.html"
      - "baja-servicio.html"
      - "politica-privacidad.html"
      - "terminos-condiciones.html"
      - "index-inline.js"
      - "legal-request-page.js"
      - "municipales-page.js"
      - "contacto-page.js"
      - "opiniones-page.js"
      - ".github/workflows/full-browser-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Instalar Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Ejecutar auditoría práctica del sitio público
        run: node tests/full-browser-audit.mjs
      - name: Ejecutar contrato del panel Admin con Supabase simulado
        run: node tests/admin-browser-audit.mjs