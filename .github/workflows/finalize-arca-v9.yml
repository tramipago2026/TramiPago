name: Finalize ARCA family image
on:
  push:
    paths:
      - '.github/workflows/finalize-arca-v9.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild ARCA image and remove stale references
        shell: bash
        run: |
          cat > /tmp/arca-v9.b64 <<'EOF'

EOF
          base64 -d /tmp/arca-v9.b64 > assets/arca-familia-v9.webp
          file assets/arca-familia-v9.webp | grep -q 'Web/P image'
          sed -i -E 's#assets/arca-familia[^"'"']*\.webp#assets/arca-familia-v9.webp#g' arca-family.js
          sed -i -E 's#arca-family\.js(\?v=[^"'"']*)?#arca-family.js?v=20260906-2011#g' index.html
          rm -f assets/arca-familia-final.webp assets/arca-familia.svg assets/arca-familia-v8.webp.b64
          rm -rf .tmp-arca
          rm -f .github/workflows/fix-arca-cache.yml
      - name: Commit final ARCA fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Repara definitivamente imagen de familia ARCA'
          git push
