name: Auditoría visual V1 aislada - Chromium

on:
  push:
    branches:
      - work/tramipago-v1-audit-20260920
    paths:
      - .github/workflows/v1-browser-visual.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Chromium aislado para prueba visual
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Recorrer 23 fichas y tomar 6 capturas en navegador local sin APIs externas
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/tramipago-audit-server.log 2>&1 &
          node tests/v1-browser-visual.mjs
      - name: Conservar capturas y resultados para inspección del propietario
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tramipago-v1-auditoria-visual
          path: audit-artifacts/
          if-no-files-found: warn
          retention-days: 14
