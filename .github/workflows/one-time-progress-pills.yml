name: One-time progress pills UI

on:
  push:
    paths:
      - '.github/workflows/one-time-progress-pills.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair progress UI patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          css_path = Path('ui.css')
          css = css_path.read_text(encoding='utf-8')
          css = css.replace('grid-template-columns: repeat(3, minmax(0, 1fr)i !important;', 'grid-template-columns: repeat(3, minmax(0, 1fr)) !important;')
          css = css.replace('content: "”";', 'content: "→";')
          css = css.replace('.choice-option:has(mnput:checked)', '.choice-option:has(input:checked)')
          css_path.write_text(css, encoding='utf-8')
          app_path = Path('app.js')
          app = app_path.read_text(encoding='utf-8')
          app = app.replace('steps.findIndex(([Gfd, label]) => Gfd === visibleStep)', 'steps.findIndex(([id, label]) => id === visibleStep)')
          app_path.write_text(app, encoding='utf-8')
          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index = re.sub(r'ui\.css\?v=[^"\']+', 'ui.css?v=20260915-progress-pills2', index)
          index = re.sub(r'app\.js\?v=[^"\']+', 'app.js?v=20260915-progress-pills2', index)
          index_path.write_text(index, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js ui.css index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Corrige estilos del progreso visual"
            git push
          fi
