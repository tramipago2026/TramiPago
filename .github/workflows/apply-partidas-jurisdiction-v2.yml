name: ApplyPartidasCaba
on:
  push:
    paths:
      - '.github/workflows/apply-partidas-jurisdiction-v2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar cambios
        run: python scripts/patch-partidas-caba.py
      - name: Validar JavaScript
        run: |
          node --check services.js
          node --check app.js
          git diff --check
          grep -q 'id: "partidas-caba"' services.js
          grep -q 'intakeOnly: true' services.js
          grep -q 'jurisdiction === "pba" || jurisdiction === "caba"' app.js
          grep -q 'startService("partidas-caba")' app.js
          ! grep -q 'La estructura queda preparada. Los trámites de CABA se habilitarán' app.js
      - name: Publicar
        run: |
          rm -f scripts/patch-partidas-caba.py
          rm -f .github/workflows/apply-partidas-jurisdiction-v2.yml
          git config user.name 'tramipago2026'
          git config user.email 'tramipago@gmail.com'
          git add -A
          git commit -m 'Habilita formularios verificados de Partidas CABA'
          git push origin HEAD:main
