name: Auditoría completa TramiPago
on:
  push:
    paths:
      - '.github/workflows/auditoria-completa.yml'
      - 'scripts/audit-site.mjs'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Iniciar sitio local
        run: |
          python3 -m http.server 4173 >/tmp/tramipago-server.log 2>&1 &
          echo $! >/tmp/tramipago-server.pid
          sleep 2
          curl -fsS http://127.0.0.1:4173/ >/dev/null
      - name: Ejecutar auditoría
        id: audit
        continue-on-error: true
        env:
          AUDIT_PASS: '1'
        run: node scripts/audit-site.mjs
      - name: Mostrar servidor si hubo fallos
        if: always()
        run: cat /tmp/tramipago-server.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auditoria-tramipago-pasada-1
          path: audit-output/
      - name: Marcar resultado
        if: steps.audit.outcome == 'failure'
        run: exit 2
