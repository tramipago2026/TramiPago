name: V2 Capturas Locales (sin despliegue)
on:
  push:
    branches:
      - v2/opcion-c-directiva13
    paths:
      - v2/tests/visual-browser-v2.mjs
      - .github/workflows/v2-visual-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-local:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verificar visualmente ocho tipos de pantallas en tres anchos
        run: node v2/tests/visual-browser-v2.mjs
      - name: Conservar capturas tres días para inspección
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tramipago-v2-visual-local
          path: v2-browser-captures/*.png
          if-no-files-found: ignore
          retention-days: 3