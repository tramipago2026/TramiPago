name: One-time Partidas cache refresh

on:
  push:
    paths:
      - '.github/workflows/one-time-partidas-cache.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh Partidas assets
        shell: bash
        run: |
          python .github/patch-partidas-cache.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/one-time-partidas-cache.yml .github/patch-partidas-cache.py
          git commit -m 'Refresh Partidas flow assets'
          git push
