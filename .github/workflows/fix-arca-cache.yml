name: Fix ARCA card and cache
on:
  push:
    paths:
      - '.github/workflows/fix-arca-cache.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update ARCA asset path and bust script cache
        run: |
          sed -i 's#assets/arca-familia-final.webp#assets/arca-familia-v8.webp#g' arca-family.js
          sed -i -E 's#arca-family\.js(\?v=[^"'"'']*)?#arca-family.js?v=20260906-2011#g' index.html
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arca-family.js index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Corrige tarjeta ARCA y fuerza cache nueva'
          git push
