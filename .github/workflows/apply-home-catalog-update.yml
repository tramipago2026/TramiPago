name: Apply catalog update
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar actualización
        run: python3 scripts/apply-home-catalog-update.py
      - name: Guardar y limpiar
        run: |
          rm -f .github/workflows/apply-home-catalog-update.yml
          rm -f .github/workflows/apply-home-catalog-update-v2.yml
          rm -f scripts/apply-home-catalog-update.py
          git config user.name 'tramipago2026'
          git config user.email 'tramipago@gmail.com'
          git add -A
          git commit -m 'Actualiza catálogo y agrega Asistencia Digital'
          git push origin HEAD:main
