name: Auditoría panel Admin TramiPago

on:
  push:
    paths:
      - "admin/**"
      - "tests/admin-browser-audit.mjs"
      - ".github/workflows/admin-browser-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Instalar Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Probar Admin completo
        run: node tests/admin-browser-audit.mjs
