name: Auditoría panel Admin TramiPago (contrato local)

on:
  push:
    paths:
      - "admin/**"
      - "tests/admin-browser-audit.mjs"
      - ".github/workflows/admin-browser-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Instalar Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Probar contrato del Admin con Supabase simulado
        run: node tests/admin-browser-audit.mjs
