name: Corrige Partidas PBA auditoria
on:
  push:
    paths:
      - '.github/workflows/corrige-partidas-pba-auditoria.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Corregir lectura de modalidad
        run: |
          sed -i "s|form.querySelector('input\[name=\"dataMode\"\]:checked')?.value|form.querySelector('[name=\"dataMode\"]')?.value|" services.js
          sed -i "s|services.js?v=20260909-audit2|services.js?v=20260909-audit3|" index.html
          grep -F "form.querySelector('[name=\"dataMode\"]')?.value" services.js
          node --check services.js
          git diff --check
      - name: Publicar
        run: |
          rm -f .github/workflows/corrige-partidas-pba-auditoria.yml
          git config user.name tramipago2026
          git config user.email tramipago@gmail.com
          git add -A
          git commit -m 'Corrige selección de modalidad en Partidas PBA'
          git push origin HEAD:main
