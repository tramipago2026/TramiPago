name: Edge create request patch
on:
  push:
    paths:
      - .github/workflows/one-time-edge-create-request.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/patch-edge-create-request.py
      - run: |
          rm scripts/patch-edge-create-request.py
          rm .github/workflows/one-time-edge-create-request.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-sync.js scripts/patch-edge-create-request.py .github/workflows/one-time-edge-create-request.yml
          git commit -m "Crea solicitudes mediante Edge Function"
          git push
