name: Construir assets carrusel V1
on:
  push:
    branches:
      - control3-carrusel-v1-final-20261005
    paths:
      - 'tmp-carousel/READY'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: control3-carrusel-v1-final-20261005
      - name: Convertir set aprobado del carrusel
        shell: bash
        run: |
          set -euo pipefail
          test "$(find tmp-carousel -maxdepth 1 -type f -name 'promo-v1-*.png' | wc -l)" -eq 9
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          srcdir=Path("tmp-carousel")
          outdir=Path("assets")
          for src in sorted(srcdir.glob("promo-v1-*.png")):
              im=Image.open(src).convert("RGB")
              if im.width != im.height:
                  raise SystemExit(f"No cuadrada: {src} {im.size}")
              im=im.resize((600,600), Image.Resampling.LANCZOS)
              out=outdir/(src.stem+".webp")
              im.save(out,"WEBP",quality=82,method=6)
              chk=Image.open(out)
              if chk.size != (600,600):
                  raise SystemExit(f"Dimensión incorrecta: {out} {chk.size}")
              print(out, out.stat().st_size)
          PY
          test "$(find assets -maxdepth 1 -type f -name 'promo-v1-*.webp' | wc -l)" -eq 9
          rm -rf tmp-carousel
          git rm .github/workflows/build-carousel-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets tmp-carousel
          git commit -m "Construir imágenes finales del carrusel V1"
          git push
