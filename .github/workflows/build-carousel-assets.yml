name: Construir assets carrusel V1
on:
  push:
    branches:
      - control3-carrusel-v1-final-20261005
    paths:
      - 'tmp-carousel/**'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: control3-carrusel-v1-final-20261005
      - name: Esperar set completo y reconstruir imágenes
        shell: bash
        run: |
          set -euo pipefail
          count=$(find tmp-carousel -maxdepth 1 -type f -name '*.b64.part*' 2>/dev/null | wc -l)
          echo "Fragmentos recibidos: $count/36"
          if [ "$count" -ne 36 ]; then
            exit 0
          fi
          for part0 in tmp-carousel/*.b64.part0; do
            base="${part0%.part0}"
            name=$(basename "$base" .b64)
            cat "$base".part0 "$base".part1 "$base".part2 "$base".part3 | base64 -d > "assets/$name"
            test -s "assets/$name"
            head -c 4 "assets/$name" | grep -q 'RIFF'
            dd if="assets/$name" bs=1 skip=8 count=4 status=none | grep -q 'WEBP'
          done
          test "$(find assets -maxdepth 1 -type f -name 'promo-v1-*.webp' | wc -l)" -eq 9
          rm -rf tmp-carousel
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets tmp-carousel
          git commit -m "Construir imágenes finales del carrusel V1"
          git push
