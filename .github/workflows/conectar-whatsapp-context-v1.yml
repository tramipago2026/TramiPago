name: Integrar WhatsApp contextual en nueve páginas aisladas
on:
  push:
    branches:
      - fix/auditoria-aranceles-20260921
    paths:
      - .github/workflows/conectar-whatsapp-context-v1.yml
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conectar sin rediseñar
        run: node scripts/conectar-ayuda-whatsapp-v1.mjs
      - name: Contratos de 23 servicios, 181 enlaces y privacidad
        run: |
          node --check whatsapp-context.js
          node --check app.js
          node tests/v1-all-links-whatsapp.mjs
          node tests/catalog-form-contract.mjs
          node tests/v1-contrato-honorarios-20260921.mjs
          node tests/site-integrity.mjs
          git diff --check
      - name: Preparar Chromium aislado
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Verificar 23 formularios y ayuda contextual en PC y móvil
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/trami-whatsapp.log 2>&1 &
          node tests/v1-all-buttons-browser.mjs
          node tests/v1-ap-recorrido-simulado.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tramipago-whatsapp-23
          path: |
            audit-artifacts/enlaces-23-tramites.json
            audit-artifacts/botones-23-tramites.json
            audit-artifacts/ap-simulado.json
          if-no-files-found: warn
          retention-days: 14
      - name: Guardar solo inclusiones de script comprobadas en rama
        run: |
          git add -- '*.html'
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Conectar WhatsApp contextual en nueve páginas sin alterar diseño'
          git push
