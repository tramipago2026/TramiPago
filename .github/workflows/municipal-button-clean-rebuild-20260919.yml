name: Renovar caché municipal sin alterar otras secciones
on:
  push:
    paths:
      - .github/workflows/municipal-button-clean-rebuild-20260919.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Actualizar versión del CSS municipal
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          html=p.read_text(encoding='utf-8')
          old='site.css?v=20260919-municipal-approved-image-one-control'
          new='site.css?v=20260919-municipal-single-real-button-v3'
          assert html.count(old)==1, 'Versión del CSS inesperada: no tocar sin revisar'
          html=html.replace(old,new,1)
          p.write_text(html,encoding='utf-8')
          css=Path('site.css').read_text(encoding='utf-8')
          assert css.count('/* Tarjeta municipal limpia.')==1
          assert '105.5% 118%' not in css
          assert 'opacity:0!important' not in css
          assert css.count('grid-template-columns:33.5% 33% 33.5%')==1
          print('PASS: fondo anterior eliminado; un botón HTML; CSS versionado')
          PY
          node --check promos.js
          node tests/municipal-route.mjs
          git add index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Invalidar cache del CSS del boton municipal único'
          git push