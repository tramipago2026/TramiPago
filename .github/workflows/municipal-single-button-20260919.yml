name: Corregir botón municipal único
on:
  push:
    paths:
      - .github/workflows/municipal-single-button-20260919.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Quitar botón impreso de la vista y conservar uno solo interactivo
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('site.css')
          css=p.read_text(encoding='utf-8')
          assert css.count('body[data-view="home"] .home-catalog .home-municipal-entry>b{')==1, 'No coincide la tarjeta municipal actual'
          assert 'https://static.wixstatic.com/media/f3de14_1b4997be000d4fc59e190a647b19f4dd~mv2.png' in css, 'La imagen original de alta resolución cambió'
          assert 'border:4px solid transparent!important' in css, 'La geometría actual del botón cambió'
          assert '/* Corrección definitiva de botón único municipal, 2026-09-19. */' not in css
          css+='''
          /* Corrección definitiva de botón único municipal, 2026-09-19.
             Ocultamos la parte impresa de la imagen en la franja central inferior;
             únicamente queda visible el botón real, sin duplicar capas verdes. */
          body[data-view="home"] .home-catalog .home-municipal-entry::before{
            content:""!important;
            position:absolute!important;
            left:34.25%!important;top:68.5%!important;
            width:29%!important;height:21.5%!important;
            background:linear-gradient(to bottom,#eafcf8 0%,#e1faf1 35%,#bcebd9 100%)!important;
            pointer-events:none!important;z-index:1!important;
          }
          body[data-view="home"] .home-catalog .home-municipal-entry>b{
            position:absolute!important;
            left:34.55%!important;top:71.05%!important;
            box-sizing:border-box!important;width:27.55%!important;height:14.8%!important;
            z-index:2!important;
            background:#198754!important;
            color:#fff!important;
            border:4px solid transparent!important;
            border-radius:999px!important;
            box-shadow:0 2px 5px rgba(8,42,71,.12)!important;
          }
          body[data-view="home"] .home-catalog .home-municipal-entry>b:hover,
          body[data-view="home"] .home-catalog .home-municipal-entry:focus-visible>b{
            color:#050505!important;
            border-color:#050505!important;
            background:#198754!important;
            box-shadow:0 4px 10px rgba(0,0,0,.25)!important;
          }
          '''
          p.write_text(css,encoding='utf-8')
          p=Path('index.html')
          html=p.read_text(encoding='utf-8')
          old='site.css?v=20260919-municipal-button-aligned-4px'
          assert html.count(old)==1, 'La versión previa de CSS no coincide; se detiene sin tocar el inicio'
          p.write_text(html.replace(old,'site.css?v=20260919-single-button-no-overlay-01',1),encoding='utf-8')
          assert css.count('Corrección definitiva de botón único municipal, 2026-09-19.')==1
          assert css.count('home-municipal-entry::before')==1
          assert css.count('border:4px solid transparent!important')==2
          print('PASS: imagen municipal HD intacta; botón impreso oculto, un solo botón HTML verde, hover negro 4 px, caché CSS renovada.')
          PY
          node --check promos.js
          node tests/municipal-route.mjs
          git add site.css index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Eliminar doble botón verde de portada y renovar CSS municipal'
          git push