name: Publicar imágenes Partidas v3
on:
  push:
    paths:
      - '.github/workflows/fix-partidas-v3.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Actualizar referencias
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          repl={
            'assets/partida-nacimiento-v2.webp':'assets/partida-nacimiento-v3.webp',
            'assets/partida-matrimonio-v2.webp':'assets/partida-matrimonio-v3.webp',
            'assets/partida-union-convivencial-v2.webp':'assets/partida-union-convivencial-v3.webp',
            'assets/partida-defuncion-v2.webp':'assets/partida-defuncion-v3.webp',
          }
          for a,b in repl.items():
              if a not in s:
                  raise SystemExit(f'No se encontró {a}')
              s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')
          q=Path('index.html')
          h=q.read_text(encoding='utf-8')
          h=re.sub(r'(\.(?:css|js)\?v=)[0-9-]+', r'\g<1>20260908-2125', h)
          q.write_text(h,encoding='utf-8')
          PY
      - name: Validar
        run: |
          node --check app.js
          grep -q 'partida-nacimiento-v3.webp' app.js
          grep -q 'partida-matrimonio-v3.webp' app.js
          grep -q 'partida-union-convivencial-v3.webp' app.js
          grep -q 'partida-defuncion-v3.webp' app.js
          test -s assets/partida-nacimiento-v3.webp
          test -s assets/partida-matrimonio-v3.webp
          test -s assets/partida-union-convivencial-v3.webp
          test -s assets/partida-defuncion-v3.webp
          git diff --check
      - name: Publicar y limpiar
        run: |
          rm -f .github/workflows/fix-partidas-v3.yml
          git config user.name 'tramipago2026'
          git config user.email 'tramipago@gmail.com'
          git add -A
          git commit -m 'Corrige imágenes de Partidas'
          git push origin HEAD:main
