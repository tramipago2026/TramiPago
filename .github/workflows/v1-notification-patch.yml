name: Preparar notificacion V1 en rama aislada
on:
  push:
    branches:
      - work/tramipago-v1-audit-20260920
    paths:
      - .github/workflows/v1-notification-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar parche quirurgico
        run: node scripts/v1-notification-patch.mjs
      - name: Verificar sintaxis y comportamiento ficticio
        run: |
          node --check backend-sync.js
          node tests/v1-notification-contract.mjs
          node tests/v1-directives.mjs
          node tests/v1-fixture-audit.mjs
          node tests/site-integrity.mjs
      - name: Registrar solamente archivos afectados en la rama de auditoria
        run: |
          git add backend-sync.js index.html tests/live-site-smoke.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Conectar aviso tras comprobante y conservar pago en revision'
          git push
