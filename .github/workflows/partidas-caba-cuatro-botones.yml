name: Partidas CABA cuatro botones
on:
  push:
    paths:
      - '.github/workflows/partidas-caba-cuatro-botones.yml'
permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar cuatro botones visuales a CABA
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text(encoding='utf-8')

          old = '''  function renderPartidaTypeCard(item, jurisdiction) {
    const available = jurisdiction === "pba";
    return `
      <button class="partidas-type-card partidas-type-${escapeHTML(item.tone)}${available ? "" : " is-unavailable"}" type="button"
        ${available ? `data-action="select-partida-type" data-part-type="${escapeHTML(item.value)}"` : 'disabled aria-disabled="true"'}
        aria-label="${escapeHTML(item.title)}${available ? "" : ", próximamente en CABA"}">
        <span class="partidas-type-media" aria-hidden="true"><img src="${escapeHTML(item.icon)}" alt="" /></span>
        <span class="catalog-card-info">
          <span class="catalog-card-title">${escapeHTML(item.title)}</span>
          <span class="catalog-card-subtitle">${escapeHTML(item.subtitle)}</span>
        </span>
        ${available ? "" : '<span class="catalog-card-badge">Próximamente</span>'}
      </button>
    `;
  }'''

          new = '''  function renderPartidaTypeCard(item, jurisdiction) {
    const available = jurisdiction === "pba";
    return `
      <button class="partidas-type-card partidas-type-${escapeHTML(item.tone)}" type="button"
        ${available ? `data-action="select-partida-type" data-part-type="${escapeHTML(item.value)}"` : 'disabled aria-disabled="true"'}
        aria-label="${escapeHTML(item.title)}${available ? "" : ", formulario CABA en preparación"}">
        <span class="partidas-type-media" aria-hidden="true"><img src="${escapeHTML(item.icon)}" alt="" /></span>
        <span class="catalog-card-info">
          <span class="catalog-card-title">${escapeHTML(item.title)}</span>
          <span class="catalog-card-subtitle">${escapeHTML(item.subtitle)}</span>
        </span>
      </button>
    `;
  }'''

          if old not in s:
              raise SystemExit('No se encontró el bloque esperado de renderPartidaTypeCard')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validar
        run: |
          node --check app.js
          grep -q 'partida-nacimiento-v3.webp' app.js
          grep -q 'partida-matrimonio-v3.webp' app.js
          grep -q 'partida-union-convivencial-v3.webp' app.js
          grep -q 'partida-defuncion-v3.webp' app.js
          ! grep -A25 'function renderPartidaTypeCard' app.js | grep -q 'catalog-card-badge'
          git diff --check

      - name: Publicar y limpiar workflow temporal
        run: |
          rm -f .github/workflows/partidas-caba-cuatro-botones.yml
          git config user.name 'tramipago2026'
          git config user.email 'tramipago@gmail.com'
          git add -A
          git commit -m 'Muestra los cuatro botones de Partidas también en CABA'
          git push origin HEAD:main
