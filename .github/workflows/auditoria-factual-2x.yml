name: Auditoria factual 2x
on:
  push:
    paths:
      - '.github/workflows/auditoria-factual-2x.yml'
      - 'scripts/audit-factual.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxis JavaScript
        run: |
          for f in *.js; do node --check "$f"; done
      - name: Instalar Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Servir sitio
        run: |
          python3 -m http.server 4173 >/tmp/tramipago-audit.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:4173/index.html >/dev/null
      - name: Pasada 1
        run: node scripts/audit-factual.mjs
      - name: Pasada 2
        run: node scripts/audit-factual.mjs
