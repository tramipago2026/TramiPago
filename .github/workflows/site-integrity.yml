name: Auditoría automática del sitio público

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar enlaces locales, imágenes y sintaxis JavaScript
        run: node tests/site-integrity.mjs
      - name: Verificar destinos de todas las tarjetas y estructura de todos los formularios
        run: node tests/catalog-form-contract.mjs
      - name: Verificar recorrido municipal de publicidad a gestiones
        run: node tests/municipal-route.mjs
      - name: Verificar cabecera, consulta legal y destinos de botones
        run: node tests/header-navigation.mjs
      - name: Verificar página de abogado y cuatro formularios
        run: node tests/legal-landing.mjs
      - name: Verificar cuatro recortes aprobados y su conexión al formulario
        run: node tests/abogado-fotos-aprobadas.mjs
      - name: Verificar precios y tokens temporales
        run: node tests/pricing-privacy-contract.mjs
      - name: Generar datos ficticios para cada servicio, opción y detectar assets potencialmente obsoletos
        run: node tests/v1-fixture-audit.mjs
      - name: Verificar aviso de comprobante sin acreditar el pago
        run: node tests/v1-notification-contract.mjs
