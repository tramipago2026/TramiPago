name: Deploy approved ARCA family image

on:
  push:
    paths:
      - 'tmp-approved/ARCA-READY'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish approved ARCA image
        shell: bash
        run: |
          set -euo pipefail
          test -f tmp-approved/arca5.b64
          base64 -d tmp-approved/arca5.b64 > assets/arca-familia-v5.webp
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('arca-family.js')
          text = p.read_text(encoding='utf-8')
          text = text.replace('image: "assets/arca-familia.svg"', 'image: "assets/arca-familia-v5.webp"')
          text = text.replace('image: "assets/arca-familia-v4.webp"', 'image: "assets/arca-familia-v5.webp"')
          p.write_text(text, encoding='utf-8')

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          text = re.sub(r'\?v=20260906-\d{4}', '?v=20260906-1738', text)
          p.write_text(text, encoding='utf-8')
          PY
          rm -rf tmp-approved
          rm -f .github/workflows/assemble-tramipago-assets.yml
          rm -f .github/workflows/deploy-approved-arca.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publica imagen aprobada de familia ARCA"
          git push
