name: Comprobar sitio productivo y conexión backend

on:
  push:
    paths:
      - '.github/workflows/live-site-smoke.yml'
      - 'tests/live-site-smoke.mjs'
  schedule:
    - cron: '41 12,23 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-published-files:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar recursos y versiones en el dominio productivo
        env:
          SITE_URL: https://tramipago.com.ar/
        run: node tests/live-site-smoke.mjs
      - name: Verificar HTTPS, www y CORS de Supabase
        run: |
          node - <<'NODE'
          const assert = (ok, msg) => { if (!ok) throw new Error(msg); };
          const root = await fetch('https://tramipago.com.ar/', { redirect: 'manual' });
          assert(root.status >= 200 && root.status < 400, 'tramipago.com.ar no responde correctamente: ' + root.status);

          const www = await fetch('https://www.tramipago.com.ar/', { redirect: 'manual' });
          assert(www.status >= 200 && www.status < 400, 'www.tramipago.com.ar no responde correctamente: ' + www.status);

          const functions = [
            'track-request','create-request','upload-file','confirm-payment',
            'submit-correction','update-request-draft','log-client-error','request-help'
          ];
          for (const fn of functions) {
            for (const goodOrigin of ['https://tramipago.com.ar','https://www.tramipago.com.ar']) {
              const cors = await fetch('https://injimzsxbnawnekybfpm.supabase.co/functions/v1/' + fn, {
                method: 'OPTIONS',
                headers: {
                  'Origin': goodOrigin,
                  'Access-Control-Request-Method': 'POST',
                  'Access-Control-Request-Headers': 'content-type,apikey'
                }
              });
              assert(cors.status >= 200 && cors.status < 300, fn + ': preflight falló: ' + cors.status);
              assert(cors.headers.get('access-control-allow-origin') === goodOrigin,
                fn + ': CORS no autoriza ' + goodOrigin + '; valor=' + cors.headers.get('access-control-allow-origin'));
            }
            const blocked = await fetch('https://injimzsxbnawnekybfpm.supabase.co/functions/v1/' + fn, {
              method: 'OPTIONS',
              headers: {
                'Origin': 'https://example.invalid',
                'Access-Control-Request-Method': 'POST',
                'Access-Control-Request-Headers': 'content-type,apikey'
              }
            });
            assert(!blocked.headers.get('access-control-allow-origin'),
              fn + ': un origen ajeno recibió permiso CORS');
          }
          console.log('PASS: dominio productivo, www y CORS estricto de las 8 funciones de Supabase válidos');
          NODE
# Auditoría HTTP actualizada al dominio productivo tramipago.com.ar, 2026-09-29.
