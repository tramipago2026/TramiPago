name: Comprobar sitio productivo y conexión backend

on:
  push:
    paths:
      - '.github/workflows/live-site-smoke.yml'
      - 'tests/live-site-smoke.mjs'
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-published-files:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verificar contrato de seguridad frontend
        run: node tests/security-contract.mjs
      - name: Verificar recursos y versiones en el dominio productivo
        env:
          SITE_URL: https://tramipago.com.ar/
        run: node tests/live-site-smoke.mjs
      - name: Verificar HTTPS, www y CORS de Supabase
        run: |
          node - <<'NODE'
          const assert = (ok, msg) => { if (!ok) throw new Error(msg); };
          const headerFailures = [];
          const headerCheck = (ok, msg) => { if (!ok) headerFailures.push(msg); };
          const http = await fetch('http://tramipago.com.ar/', { redirect: 'manual' });
          const redirectLocation = http.headers.get('location') || '';
          headerCheck([301,302,307,308].includes(http.status), 'HTTP no redirige: ' + http.status);
          headerCheck(redirectLocation.startsWith('https://'), 'HTTP no redirige a HTTPS: ' + redirectLocation);

          const root = await fetch('https://tramipago.com.ar/', { redirect: 'manual' });
          headerCheck(root.status >= 200 && root.status < 400, 'tramipago.com.ar no responde correctamente: ' + root.status);
          const observedHeaders = {
            hsts: root.headers.get('strict-transport-security') || '',
            csp: root.headers.get('content-security-policy') || '',
            nosniff: root.headers.get('x-content-type-options') || '',
            xfo: root.headers.get('x-frame-options') || '',
            referrer: root.headers.get('referrer-policy') || '',
            permissions: root.headers.get('permissions-policy') || ''
          };
          const xfo = observedHeaders.xfo.toUpperCase();
          headerCheck(Boolean(observedHeaders.hsts), 'Falta Strict-Transport-Security');
          headerCheck(observedHeaders.nosniff.toLowerCase() === 'nosniff', 'Falta X-Content-Type-Options: nosniff');
          headerCheck(Boolean(observedHeaders.referrer), 'Falta Referrer-Policy');
          headerCheck(Boolean(observedHeaders.permissions), 'Falta Permissions-Policy');
          headerCheck(Boolean(observedHeaders.csp), 'Falta Content-Security-Policy como header HTTP real');
          headerCheck(xfo === 'DENY' || xfo === 'SAMEORIGIN' || /frame-ancestors\s+[^;]+/i.test(observedHeaders.csp), 'Falta protección contra framing');
          console.log(JSON.stringify({httpStatus:http.status,httpLocation:redirectLocation,httpsStatus:root.status,observedHeaders}));
          if (headerFailures.length) throw new Error(headerFailures.join(' | '));

          const www = await fetch('https://www.tramipago.com.ar/', { redirect: 'manual' });
          assert(www.status >= 200 && www.status < 400, 'www.tramipago.com.ar no responde correctamente: ' + www.status);

          const functions = [
            'track-request','create-request','upload-file','confirm-payment',
            'submit-correction','update-request-draft','log-client-error','request-help'
          ];
          for (const fn of functions) {
            for (const goodOrigin of ['https://tramipago.com.ar','https://www.tramipago.com.ar']) {
              const cors = await fetch('https://injimzsxbnawnekybfpm.supabase.co/functions/v1/' + fn, {
                method: 'OPTIONS',
                headers: {
                  'Origin': goodOrigin,
                  'Access-Control-Request-Method': 'POST',
                  'Access-Control-Request-Headers': 'content-type,apikey'
                }
              });
              assert(cors.status >= 200 && cors.status < 300, fn + ': preflight falló: ' + cors.status);
              assert(cors.headers.get('access-control-allow-origin') === goodOrigin,
                fn + ': CORS no autoriza ' + goodOrigin + '; valor=' + cors.headers.get('access-control-allow-origin'));
            }
            for (const badOrigin of ['https://example.invalid','https://tramipago2026.github.io']) {
              const blocked = await fetch('https://injimzsxbnawnekybfpm.supabase.co/functions/v1/' + fn, {
                method: 'OPTIONS',
                headers: {
                  'Origin': badOrigin,
                  'Access-Control-Request-Method': 'POST',
                  'Access-Control-Request-Headers': 'content-type,apikey'
                }
              });
              assert(!blocked.headers.get('access-control-allow-origin'),
                fn + ': origen no autorizado recibió permiso CORS: ' + badOrigin);
            }
          }
          console.log('PASS: dominio productivo, www y CORS estricto de las 8 funciones de Supabase válidos');

          const { readFileSync } = await import('node:fs');
          const backend = readFileSync('backend-sync.js','utf8');
          const keyMatch = backend.match(/PUBLISHABLE_KEY="([^"]+)"/);
          assert(keyMatch, 'No se encontró la publishable key del frontend para la prueba');
          const headers = {
            'Origin': 'https://tramipago.com.ar',
            'apikey': keyMatch[1],
            'Content-Type': 'application/json'
          };
          const invalidJsonChecks = [
            ['track-request',{code:'INVALID',last4:'0000'},[200,400,429]],
            ['create-request',{},[400,429]],
            ['submit-correction',{},[400,403,429]],
            ['update-request-draft',{},[400,403,429]],
            ['log-client-error',{},[400,429]],
            ['request-help',{},[400,403,429]]
          ];
          for (const [fn,body,allowed] of invalidJsonChecks) {
            const response = await fetch('https://injimzsxbnawnekybfpm.supabase.co/functions/v1/' + fn, {
              method:'POST', headers, body:JSON.stringify(body)
            });
            assert(allowed.includes(response.status), fn + ': respuesta inesperada ' + response.status);
            assert(response.status < 500, fn + ': devolvió error 5xx');
          }
          for (const fn of ['upload-file','confirm-payment']) {
            const form = new FormData();
            const response = await fetch('https://injimzsxbnawnekybfpm.supabase.co/functions/v1/' + fn, {
              method:'POST',
              headers:{'Origin':'https://tramipago.com.ar','apikey':keyMatch[1]},
              body:form
            });
            assert([400,403,429].includes(response.status), fn + ': respuesta inesperada ' + response.status);
            assert(response.status < 500, fn + ': devolvió error 5xx');
          }
          console.log('PASS: las 8 Edge Functions ejecutan rutas reales no destructivas sin errores 5xx');
          NODE
# Auditoría HTTP actualizada al dominio productivo tramipago.com.ar, 2026-09-29.
