name: Integrar ayuda contextual y auditar enlaces en rama aislada
on:
  push:
    branches:
      - work/tramipago-v1-audit-20260920
    paths:
      - .github/workflows/v1-link-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conectar ayuda sin tocar main o Supabase
        run: node scripts/v1-link-patch.mjs
      - name: Auditar enlaces y rutas de los 23 servicios
        run: |
          node --check whatsapp-context.js
          node tests/v1-all-links-whatsapp.mjs
          node tests/catalog-form-contract.mjs
          node tests/site-integrity.mjs
      - name: Registrar solo los archivos modificados en rama de prueba
        run: |
          git add -- '*.html' whatsapp-context.js
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Conectar WhatsApp con origen, trámite, etapa, código y estado' || exit 1
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tramipago-enlaces-23
          path: audit-artifacts/enlaces-23-tramites.json
          if-no-files-found: warn
          retention-days: 14
