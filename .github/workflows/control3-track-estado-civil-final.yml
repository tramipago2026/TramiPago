name: TEMP CONTROL3 seguimiento Estado Civil final
on:
  push:
    branches: [control3-estado-civil-e2e-20261007]
    paths:
      - "tests/control3-track-estado-civil-final.mjs"
      - ".github/workflows/control3-track-estado-civil-final.yml"
permissions:
  contents: read
jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: "22"}
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: node tests/control3-track-estado-civil-final.mjs
