name: Prueba E2E producción controlada

on:
  push:
    paths:
      - ".github/workflows/e2e-production-once.yml"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Crear, completar y consultar solicitud sintética
        run: |
          node - <<'NODE'
          import {readFileSync} from 'node:fs';
          const backend=readFileSync('backend-sync.js','utf8');
          const key=backend.match(/PUBLISHABLE_KEY="([^"]+)"/)?.[1];
          if(!key) throw new Error('Publishable key no encontrada');
          const base='https://injimzsxbnawnekybfpm.supabase.co/functions/v1/';
          const headers={'Origin':'https://tramipago.com.ar','apikey':key,'Content-Type':'application/json'};
          const post=async(fn,body)=>{
            const r=await fetch(base+fn,{method:'POST',headers,body:JSON.stringify(body)});
            const j=await r.json().catch(()=>({}));
            if(r.status>=500) throw new Error(fn+' devolvió '+r.status+': '+JSON.stringify(j));
            return {status:r.status,data:j};
          };
          const created=await post('create-request',{serviceId:'abogado-art',complete:false});
          if(created.status!==201||!created.data.code||!created.data.requestToken) throw new Error('create-request falló: '+JSON.stringify(created));
          const code=created.data.code, token=created.data.requestToken;
          const completed=await post('update-request-draft',{
            code,
            requestToken:token,
            clientName:'AUDITORIA AUTOMATICA TRAMIPAGO',
            email:null,
            whatsapp:'5491112345678',
            formData:{
              fullName:'AUDITORIA AUTOMATICA TRAMIPAGO',
              caseType:'prueba-tecnica',
              notes:'PRUEBA E2E CONTROLADA - ELIMINAR',
              authorization:true
            },
            currentStep:'confirmation',
            completionPercent:100,
            complete:true,
            missingFields:[]
          });
          if(completed.status!==200||completed.data.ok!==true) throw new Error('update-request-draft falló: '+JSON.stringify(completed));
          const tracked=await post('track-request',{code,last4:'5678'});
          if(tracked.status!==200||tracked.data.ok!==true||tracked.data.code!==code) throw new Error('track-request falló: '+JSON.stringify(tracked));
          console.log('E2E_PRODUCTION_PASS code='+code+' status='+tracked.data.status);
          NODE
