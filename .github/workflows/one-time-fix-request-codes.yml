name: One-time fix request codes

on:
  push:
    paths:
      - '.github/workflows/one-time-fix-request-codes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix backend registration and compact codes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly 1 match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_exact(
              'backend-sync.js',
              'meta={raw:data.requestToken,code:data.code,serverId:null,lastSignature:"",paymentUploaded:false,files:{}};',
              'meta={raw:data.requestToken,code:data.code,serverId:data.id||null,lastSignature:"",paymentUploaded:false,files:{}};'
          )
          replace_exact(
              'backend-sync.js',
              'request.serverId=null;',
              'request.serverId=data.id||null;'
          )
          replace_exact(
              'backend-sync.js',
              'input.placeholder="AP-000012-A1B2";',
              'input.placeholder="AP-000012";'
          )
          replace_exact(
              'security-hardening.js',
              'codeInput.placeholder="AP-000012-A1B2C3D4";',
              'codeInput.placeholder="AP-000012";'
          )
          replace_exact(
              'app.js',
              '    const suffix = Math.random().toString(36).slice(2, 4).toUpperCase();\n    return `${prefix}-${String(current).padStart(5, "0")}-${suffix}`;',
              '    return `${prefix}-${String(current).padStart(6, "0")}`;'
          )

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('app.js?v=20260915-progress-pills2', 'app.js?v=20260915-request-code-fix1')
          text = text.replace('security-hardening.js?v=20260914-security2', 'security-hardening.js?v=20260915-request-code-fix1')
          text = text.replace('backend-sync.js?v=20260913-backend-compact', 'backend-sync.js?v=20260915-request-code-fix1')
          p.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/one-time-fix-request-codes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js backend-sync.js security-hardening.js index.html .github/workflows/one-time-fix-request-codes.yml
          git commit -m "Corrige registro y códigos compactos de solicitudes"
          git push
