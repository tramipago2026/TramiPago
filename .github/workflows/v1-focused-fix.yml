name: Parche quirúrgico V1 - SOLO rama de trabajo

on:
  push:
    branches:
      - work/tramipago-v1-audit-20260920
    paths:
      - .github/workflows/v1-focused-fix.yml
      - scripts/v1-focused-fix.mjs

permissions:
  contents: write

jobs:
  focused-fix:
    if: github.ref == 'refs/heads/work/tramipago-v1-audit-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/tramipago-v1-audit-20260920
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar parche exclusivamente a la rama de trabajo
        run: node scripts/v1-focused-fix.mjs
      - name: Validar sintaxis y contratos antes de realizar commit
        run: |
          node --check app.js
          node --check extra-families.js
          node tests/site-integrity.mjs
          node tests/catalog-form-contract.mjs
          node tests/pricing-privacy-contract.mjs
          node tests/v1-directives.mjs
          node tests/v1-fixture-audit.mjs
      - name: Commit únicamente en la rama de revisión; nunca main ni Pages
        run: |
          git add -A -- app.js extra-families.js index.html tests/live-site-smoke.mjs
          git diff --cached --check
          if git diff --cached --quiet; then echo 'Sin modificaciones'; exit 0; fi
          git config user.name 'tramipago-v1-audit-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Eliminar visualización de arancel oficial sin tocar honorarios ni diseño'
          git push origin HEAD:refs/heads/work/tramipago-v1-audit-20260920
