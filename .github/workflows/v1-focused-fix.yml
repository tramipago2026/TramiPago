name: Parche quirúrgico V1 - SOLO rama de trabajo

on:
  push:
    branches:
      - work/tramipago-v1-audit-20260920
    paths:
      - .github/workflows/v1-focused-fix.yml

permissions:
  contents: write

jobs:
  focused-fix:
    if: github.ref == 'refs/heads/work/tramipago-v1-audit-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/tramipago-v1-audit-20260920
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar parche solo a código y recursos auditados de la rama
        run: node scripts/v1-focused-fix.mjs
      - name: Validación de sintaxis y contratos vigentes
        run: |
          node --check app.js
          node --check extra-families.js
          node tests/site-integrity.mjs
          node tests/catalog-form-contract.mjs
          node tests/pricing-privacy-contract.mjs
          node tests/v1-directives.mjs
          node tests/v1-fixture-audit.mjs
      - name: Publicar únicamente commit de rama de revisión (NUNCA main ni GitHub Pages)
        run: |
          git add -A -- app.js extra-families.js index.html tests/live-site-smoke.mjs assets/justicia-balanza-martillo-20260918.svg
          git diff --cached --check
          if git diff --cached --quiet; then echo 'Sin cambios para confirmar'; exit 0; fi
          git config user.name 'tramipago-v1-audit-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Corregir exposición de costos oficiales y versión de caché en rama de prueba'
          git push origin HEAD:refs/heads/work/tramipago-v1-audit-20260920
