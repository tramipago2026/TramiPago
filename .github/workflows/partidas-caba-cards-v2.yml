name: PartidasCabaCards
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch app
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          old1 = 'partidas-type-card partidas-type-${escapeHTML(item.tone)}${available ? "" : " is-unavailable"}'
          new1 = 'partidas-type-card partidas-type-${escapeHTML(item.tone)}'
          if old1 not in s:
              raise SystemExit('No se encontro clase unavailable esperada')
          s = s.replace(old1, new1, 1)
          old2 = '        ${available ? "" : \'<span class="catalog-card-badge">Próximamente</span>\'}\n'
          if old2 not in s:
              raise SystemExit('No se encontro badge esperado')
          s = s.replace(old2, '', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate
        run: |
          node --check app.js
          grep -q 'partida-nacimiento-v3.webp' app.js
          grep -q 'partida-matrimonio-v3.webp' app.js
          grep -q 'partida-union-convivencial-v3.webp' app.js
          grep -q 'partida-defuncion-v3.webp' app.js
          git diff --check
      - name: Publish
        run: |
          rm -f .github/workflows/partidas-caba-cards-v2.yml
          rm -f .github/workflows/partidas-caba-cuatro-botones.yml
          git config user.name 'tramipago2026'
          git config user.email 'tramipago@gmail.com'
          git add -A
          git commit -m 'Muestra los cuatro botones de Partidas en CABA'
          git push origin HEAD:main
