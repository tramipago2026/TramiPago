name: Auditoría E2E única TramiPago

on:
  push:
    paths:
      - '.github/workflows/e2e-once.yml'
      - 'tests/live-e2e-once.mjs'

permissions:
  contents: read

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Ejecutar circuito real cliente a correo
        run: node tests/live-e2e-once.mjs
