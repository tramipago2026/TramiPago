name: Corregir doble botón municipal v2
on:
  push:
    paths:
      - .github/workflows/municipal-one-button-fix-v2-20260919.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Dejar un solo botón y publicar versión nueva
        run: |
          python - <<'PY'
          from pathlib import Path
          cssfile=Path('site.css')
          css=cssfile.read_text(encoding='utf-8')
          assert 'f3de14_1b4997be000d4fc59e190a647b19f4dd~mv2.png' in css
          assert 'body[data-view="home"] .home-catalog .home-municipal-entry>b{' in css
          assert 'Corrección definitiva de botón único municipal' not in css
          css+='''
          /* Corrección definitiva de botón único municipal: tapar botón impreso bajo el control interactivo. */
          body[data-view="home"] .home-catalog .home-municipal-entry::before{
            content:""!important;position:absolute!important;
            left:34.25%!important;top:68.5%!important;
            width:29%!important;height:21.5%!important;
            background:linear-gradient(to bottom,#eafcf8 0%,#e1faf1 35%,#bcebd9 100%)!important;
            pointer-events:none!important;z-index:1!important;
          }
          body[data-view="home"] .home-catalog .home-municipal-entry>b{
            z-index:2!important;position:absolute!important;
            box-sizing:border-box!important;left:34.55%!important;top:71.05%!important;
            width:27.55%!important;height:14.8%!important;
            color:#fff!important;background:#198754!important;
            border:4px solid transparent!important;border-radius:999px!important;
            box-shadow:0 2px 5px rgba(8,42,71,.12)!important;
          }
          body[data-view="home"] .home-catalog .home-municipal-entry>b:hover,
          body[data-view="home"] .home-catalog .home-municipal-entry:focus-visible>b{
            color:#050505!important;background:#198754!important;
            border-color:#050505!important;
            box-shadow:0 4px 10px rgba(0,0,0,.25)!important;
          }
          '''
          cssfile.write_text(css,encoding='utf-8')
          p=Path('index.html');html=p.read_text(encoding='utf-8')
          old='site.css?v=20260919-municipal-button-aligned-4px'
          assert html.count(old)==1, 'Versión CSS no coincide'
          p.write_text(html.replace(old,'site.css?v=20260919-single-municipal-button-fix-v2',1),encoding='utf-8')
          assert css.count('home-municipal-entry::before')==1
          assert css.count('border:4px solid transparent!important')>=2
          print('PASS: imagen original, botón único, borde negro de 4 px solo al hover, nueva versión CSS')
          PY
          node --check promos.js
          node tests/municipal-route.mjs
          git add site.css index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Ocultar botón impreso y dejar un solo botón municipal real'
          git push