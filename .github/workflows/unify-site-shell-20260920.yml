name: Verificar cabecera y pie del sitio público

on:
  push:
    paths:
      - "index.html"
      - "footer-menu.js"
      - "shared-site-shell.css"
      - "*.html"
      - ".github/workflows/unify-site-shell-20260920.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verificar navegación y contacto
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const pages=fs.readdirSync('.').filter(x=>x.endsWith('.html')&&x!=='index.html');
          if(!pages.length)throw new Error('No hay páginas públicas');
          for(const p of pages){
            const s=fs.readFileSync(p,'utf8');
            for(const needle of ['class="nav-home"','class="nav-tracking"','class="nav-help"','Ver mi trámite','wa.me/5491167083232','tramipago@gmail.com']){
              if(!s.includes(needle))throw new Error(p+' no contiene '+needle);
            }
          }
          console.log('PASS:',pages.length,'páginas con navegación y contacto válidos');
          NODE
          node tests/header-navigation.mjs
          node tests/site-integrity.mjs
