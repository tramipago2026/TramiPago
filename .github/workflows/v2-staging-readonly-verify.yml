name: V2 Staging verificacion independiente (solo lectura)
on:
  push:
    branches:
      - v2/opcion-c-directiva13
    paths:
      - .github/workflows/v2-staging-readonly-verify.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Confirmar revision visual realmente servida en staging aislado
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base='https://tramipago-v2-api-staging.tramipago.workers.dev';
          const expected='58e9a39e8327ad82d0c2f18f87766176813b0a60';
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          async function check(){
            const health=await fetch(base+'/v2/health/dependencies',{headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(12000)});
            assert.equal(health.status,200,'staging dependencies HTTP status');
            const info=await health.json();
            assert.equal(info.environment,'staging','entorno equivocado');
            assert.equal(info.frontendCommit,expected,'version visual servida no coincide');
            const page=await fetch(base+'/v2/',{headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(12000)});
            assert.equal(page.status,200,'portada publicada');
            assert.match(page.headers.get('x-robots-tag')??'',/noindex/,'staging no debe indexarse');
            const html=await page.text();
            for(const name of [
              'hero-pareja-45-50-aprobada.webp',
              'home-antecedentes-aprobada.webp',
              'home-anses-aprobada.webp',
              'home-vehicular-aprobada.webp',
              'home-arba-aprobada.webp',
              'home-partidas-aprobada.webp',
              'home-arca-aprobada.webp',
              'home-apostillas-aprobada.webp',
              'home-abogado-aprobada.webp'
            ])assert.ok(html.includes('/v2/assets/'+name),'falta foto aprobada '+name);
            assert.equal((html.match(/class="card-photo(?: card-art)?"/g)??[]).length,8,'faltan tarjetas');
            assert.ok(html.includes('/v2/seguimiento/'),'falta acceso seguimiento');
            const css=await fetch(base+'/v2/assets/v2.css',{signal:AbortSignal.timeout(12000)});
            assert.equal(css.status,200,'CSS compartido servido');
            const stylesheet=await css.text();
            assert.ok(stylesheet.includes('--tp-brand:#006cf5'),'estilos visuales actualizados');
            assert.ok(stylesheet.includes('--tp-text-action:17px'),'botones con tamaño unificado');
            assert.ok(stylesheet.includes('TP-V2-DISENO-INTEGRAL-26-1'),'base de diseño integral servida');
            assert.ok(stylesheet.includes('TP-V2-MUESTRA-INTERIORES-26-APROBADA'),'falta boton aprobado');
            for(const [asset,needle] of [
              ['/v2/assets/request-flow-v2.css','TP-V2-MUESTRA-PAGO-Y-FORMULARIOS-26-APROBADA'],
              ['/v2/assets/admin-layout.css','TP-V2-MUESTRA-ADMIN-26-APROBADA'],
              ['/v2/assets/v2.js','quoteNode.replaceChildren(label,amount)'],
              ['/v2/assets/flow-v2.js','v2-bank-list']
            ]){
              const response=await fetch(base+asset,{headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(12000)});
              assert.equal(response.status,200,'asset '+asset);
              assert.ok((await response.text()).includes(needle),'contenido visual no publicado: '+asset);
            }
            for(const route of ['/v2/tramites/constancias-anses/','/v2/tramites/constancias-anses/pago/','/v2/admin/','/v2/ayuda/']){
              const response=await fetch(base+route,{signal:AbortSignal.timeout(12000)});
              assert.equal(response.status,200,'ruta V2 '+route);
              assert.ok((await response.text()).includes('/v2/assets/v2.css'),'sin diseño global '+route);
            }
            const hero=await fetch(base+'/v2/assets/hero-pareja-45-50-aprobada.webp',{signal:AbortSignal.timeout(12000)});
            assert.equal(hero.status,200,'foto principal HTTP');
            assert.match(hero.headers.get('content-type')??'',/image\/webp/,'foto principal no es WebP');
            assert.ok((await hero.arrayBuffer()).byteLength>1000,'foto principal vacia');
            for(const key of ['constancias-anses','arca']){
              const photo=await fetch(base+'/v2/photo/'+key+'.jpg',{signal:AbortSignal.timeout(14000)});
              assert.equal(photo.status,200,'foto interior '+key+' HTTP');
              assert.match(photo.headers.get('content-type')??'',/image\/(jpeg|webp)/,'foto interior no decodificable '+key);
              assert.ok((await photo.arrayBuffer()).byteLength>1000,'foto interior vacia '+key);
            }
            console.log('PASS CONTROL 3 lectura independiente: staging, portada, 8 tarjetas, CSS aprobado, foto interior, rutas y noindex');
          }
          let last;
          for(let i=0;i<8;i++){
            try{await check();process.exit(0)}catch(error){last=error;console.log('Intento '+(i+1)+': '+error.message);if(i<7)await sleep(6000)}
          }
          console.error('BLOQUEADO: staging no comprobado independientemente',last);
          process.exit(1);
          NODE

  browser-live:
    name: Validar interfaz publicada en Chrome (solo lectura)
    needs: read-live
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Capturar portada, ANSES, pago y Admin del staging real
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import {execFileSync,spawn} from 'node:child_process';
          const base='https://tramipago-v2-api-staging.tramipago.workers.dev';
          const out='v2-staging-visual-capturas';
          fs.mkdirSync(out,{recursive:true});
          let chrome;
          for(const exe of ['google-chrome','google-chrome-stable','chromium']){
            try{execFileSync('which',[exe],{stdio:'ignore'});chrome=exe;break}catch{}
          }
          assert.ok(chrome,'Chrome ausente; no aprobar sin navegador');
          const profile=fs.mkdtempSync(path.join(os.tmpdir(),'tp-staging-ro-'));
          const browser=spawn(chrome,['--headless=new','--no-sandbox','--disable-gpu','--disable-dev-shm-usage','--no-first-run','--remote-debugging-port=0','--user-data-dir='+profile,'about:blank'],{stdio:'ignore'});
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          let socket;
          try{
            let port;
            for(let i=0;i<100;i++){
              const f=path.join(profile,'DevToolsActivePort');
              if(fs.existsSync(f)){port=Number(fs.readFileSync(f,'utf8').split('\n')[0]);break}
              if(browser.exitCode!==null)throw Error('Chrome detenido');
              await sleep(100);
            }
            assert.ok(port,'Chrome DevTools indisponible');
            const targets=await(await fetch('http://127.0.0.1:'+port+'/json')).json();
            socket=new WebSocket(targets.find(t=>t.type==='page').webSocketDebuggerUrl);
            await new Promise((resolve,reject)=>{socket.addEventListener('open',resolve,{once:true});socket.addEventListener('error',reject,{once:true})});
            let seq=0;const pending=new Map();
            socket.addEventListener('message',e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(m.error):p.resolve(m.result)}});
            const cmd=(method,params={})=>new Promise((resolve,reject)=>{const id=++seq;pending.set(id,{resolve,reject});socket.send(JSON.stringify({id,method,params}))});
            await cmd('Page.enable');await cmd('Runtime.enable');
            const routes=[['/v2/','portada'],['/v2/tramites/constancias-anses/','anses'],['/v2/tramites/constancias-anses/pago/','pago-anses'],['/v2/admin/','admin']];
            for(const width of [375,768,1440]){
              await cmd('Emulation.setDeviceMetricsOverride',{width,height:900,deviceScaleFactor:1,mobile:false});
              for(const [route,name] of routes){
                await cmd('Page.navigate',{url:base+route});
                await sleep(1000);
                const expr=`JSON.stringify((()=>{const parent=document.querySelector('.content')||document.body;const p=document.createElement('p');p.className='muted v2-price-summary';p.textContent='Importe de prueba';const amount=document.createElement('strong');amount.className='v2-price-amount';amount.textContent='$ 2000';p.append(amount);const b=document.createElement('button');b.className='button';b.textContent='Acción';parent.append(p,b);const x={title:document.title,header:!!document.querySelector('header'),overflow:document.documentElement.scrollWidth-innerWidth,broken:[...document.images].filter(i=>i.complete&&!i.naturalWidth&&(i.src.includes('/v2/assets/')||i.src.includes('/v2/photo/'))).length,price:parseFloat(getComputedStyle(amount).fontSize),action:parseFloat(getComputedStyle(b).fontSize),minHeight:parseFloat(getComputedStyle(b).minHeight),request:document.body.classList.contains('request-page')};p.remove();b.remove();return x})())`;
                const result=await cmd('Runtime.evaluate',{expression:expr,returnByValue:true});
                const state=JSON.parse(result.result.value);
                assert.ok(state.header,'sin cabecera '+route);
                assert.ok(state.title,'titulo faltante '+route);
                assert.ok(state.overflow<=2,'desborde '+route+': '+state.overflow);
                assert.equal(state.broken,0,'imagenes faltantes '+route);
                assert.ok(state.action>=16&&state.minHeight>=48,'boton ilegible '+route);
                if(state.request)assert.ok(state.price>=19,'importe pequeno '+route+': '+state.price);
                const screen=await cmd('Page.captureScreenshot',{format:'png',captureBeyondViewport:false});
                fs.writeFileSync(out+'/'+name+'-'+width+'.png',Buffer.from(screen.data,'base64'));
                console.log('PASS CHROME STAGING',route,width,'precio',state.price,'boton',state.action,'alto',state.minHeight);
              }
            }
            console.log('PASS CONTROL 3 navegador staging real: 12 capturas, importes y botones legibles, rutas V2');
          }finally{
            try{socket?.close()}catch{}
            browser.kill('SIGTERM');fs.rmSync(profile,{recursive:true,force:true,maxRetries:5});
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tramipago-v2-staging-visual-26-1
          path: v2-staging-visual-capturas/*.png
          if-no-files-found: ignore
          retention-days: 3
