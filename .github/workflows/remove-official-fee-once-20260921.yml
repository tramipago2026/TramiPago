name: Corrección aislada costo oficial (solo rama de prueba)
on:
  push:
    branches: [work/remove-official-fee-display-20260921]
    paths: [.github/workflows/remove-official-fee-once-20260921.yml]
permissions:
  contents: write
jobs:
  correct-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/remove-official-fee-display-20260921
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Quitar exclusivamente las dos filas de tasas en el resumen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('app.js')
          source=path.read_text(encoding='utf-8')
          anchor='  function renderServiceSummary(service) {'
          boundary='\n  const PARTIDAS_TYPE_CARDS'
          assert source.count(anchor)==1, 'Bloque de resumen ambiguo'
          start=source.index(anchor)
          end=source.index(boundary,start)
          original=source[start:end]
          assert original.count('Costo oficial')==2, 'Se esperaban exactamente dos rótulos'
          selector='        ${service.intakeOnly\n'
          assert original.count(selector)==1, 'Cambio estructural imprevisto'
          suffix_marker='      </div>\n    `;\n  }'
          assert original.count(suffix_marker)==1, 'Cierre ambiguo'
          prefix=original[:original.index(selector)]
          suffix=original[original.index(suffix_marker):]
          replacement=prefix+'''        ${service.intakeOnly ? "" : `<div class="service-summary-block">
              <h3>Precio y plazo</h3>
              ${renderPriceOptions(service)}
            </div>`}
          '''+suffix
          assert 'Costo oficial' not in replacement
          assert replacement.count('renderPriceOptions(service)')==1
          assert prefix.count('<h3>Requisitos</h3>')==1
          updated=source[:start]+replacement+source[end:]
          assert updated.count(anchor)==1
          assert updated[:start]==source[:start]
          assert updated[start+len(replacement):]==source[end:]
          path.write_text(updated,encoding='utf-8')
          print('PASS: modificación aislada del resumen de servicio')
          PY
      - name: Sintaxis y regresión estática
        run: |
          git diff --check
          node --check app.js
          node tests/site-integrity.mjs
          node tests/catalog-form-contract.mjs
          node tests/pricing-privacy-contract.mjs
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app.js').read_text(encoding='utf-8')
          b=s[s.index('  function renderServiceSummary(service) {'):s.index('\n  const PARTIDAS_TYPE_CARDS')]
          assert 'Costo oficial' not in b and 'Arancel del organismo' not in b
          assert '<h3>Precio y plazo</h3>' in b and 'renderPriceOptions(service)' in b
          print('PASS: honorarios visibles; sin filas de arancel oficial')
          PY
      - name: Registrar corrección solo en rama no publicada
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app.js
          git diff --cached --check
          git diff --cached --quiet && exit 1 || true
          git commit -m 'Ocultar exclusivamente filas de costo oficial en fichas'
          git push origin HEAD:refs/heads/work/remove-official-fee-display-20260921
