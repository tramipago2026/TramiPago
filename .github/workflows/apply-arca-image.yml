name: Apply approved ARCA image

on:
  push:
    paths:
      - 'assets/arca-familia-final.webp'
      - '.github/workflows/apply-arca-image.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point ARCA family card to approved image
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('arca-family.js')
          text = p.read_text(encoding='utf-8')
          text = text.replace('image: "assets/arca-familia.svg"', 'image: "assets/arca-familia-final.webp"')
          text = text.replace('image: "assets/arca-familia-v5.svg"', 'image: "assets/arca-familia-final.webp"')
          text = text.replace('image: "assets/arca-familia-v4.webp"', 'image: "assets/arca-familia-final.webp"')
          p.write_text(text, encoding='utf-8')

          idx = Path('index.html')
          s = idx.read_text(encoding='utf-8')
          s = re.sub(r'\?v=20260906-\d{4}', '?v=20260906-1805', s)
          idx.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/apply-arca-image.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Corrige imagen de familia ARCA" || exit 0
          git push
