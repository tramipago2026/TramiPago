name: Preparar parche de CTA y formularios para publicación
on:
  push:
    branches:
      - fix/legalizaciones-cta-publicacion-20260921
    paths:
      - .github/workflows/aplicar-cta-publicacion-20260921.yml
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recuperar únicamente la corrección verificada y pruebas del branch de auditoría
        run: |
          git fetch --depth=1 origin work/tramipago-v1-audit-20260920:refs/remotes/origin/work/tramipago-v1-audit-20260920
          git show origin/work/tramipago-v1-audit-20260920:tests/v1-new-links-design.mjs > tests/.temporal-verificacion-cta.mjs
          git show origin/work/tramipago-v1-audit-20260920:tests/v1-file-hints-browser.mjs > tests/.temporal-verificacion-aviso.mjs
          node scripts/aplicar-parche-cta-publicacion-20260921.mjs
      - name: Integridad estática de los servicios y los scripts
        run: |
          node --check app.js
          node --check site-fixes.js
          node tests/site-integrity.mjs
          node tests/catalog-form-contract.mjs
          git diff --check
      - name: Instalar Chromium de pruebas
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Probar visual, navegación y aviso único en PC y móvil SIN enviar solicitudes
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/tramipago-test-server.log 2>&1 &
          node tests/.temporal-verificacion-cta.mjs
          node tests/.temporal-verificacion-aviso.mjs
      - name: Guardar solo cuatro cambios probados en la rama de publicación
        run: |
          rm tests/.temporal-verificacion-cta.mjs tests/.temporal-verificacion-aviso.mjs
          git add index.html site.css site-fixes.js legalizaciones-fotos-20260918.css
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Restaurar botones visibles de Legalizaciones/Apostillas y aviso PDF único'
          git push
