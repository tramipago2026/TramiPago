name: Apply approved Partidas image

on:
  push:
    branches: [main]
    paths:
      - 'tmp-partidas-20260906/**'
      - '.github/workflows/apply-partidas-image.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct approved image and update family
        shell: bash
        run: |
          set -euo pipefail
          cat tmp-partidas-20260906/part-*.txt | tr -d '\n\r' | base64 -d > assets/partidas-familia-final.webp
          python3 - <<'PY'
          from pathlib import Path
          p = Path('services.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('image: "assets/partidas-pba-v4.svg",', 'image: "assets/partidas-familia-final.webp",')
          p.write_text(s, encoding='utf-8')
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in {'.js','.html','.css','.md'}:
                  continue
              try:
                  t = path.read_text(encoding='utf-8')
              except Exception:
                  continue
              nt = t.replace('Registro Civil PBA', 'Registro Civil')
              if nt != t:
                  path.write_text(nt, encoding='utf-8')
          PY
          rm -rf tmp-partidas-20260906
          rm -f .github/workflows/apply-partidas-image.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Actualiza imagen de familia Partidas' || exit 0
          git push
