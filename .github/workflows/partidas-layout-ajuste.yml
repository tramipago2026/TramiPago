name: Ajuste visual selector Partidas
on:
  push:
    paths:
      - '.github/workflows/partidas-layout-ajuste.yml'
      - 'scripts/ajustar_partidas_layout.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar cambios
        run: python scripts/ajustar_partidas_layout.py
      - name: Validar
        run: |
          node --check app.js
          grep -q 'Seleccioná dónde está inscripta la partida' app.js
          grep -q 'partidas-flow-steps' index.html
          git diff --check
      - name: Publicar
        run: |
          rm -f scripts/ajustar_partidas_layout.py
          rm -f .github/workflows/partidas-layout-ajuste.yml
          git config user.name 'tramipago2026'
          git config user.email 'tramipago@gmail.com'
          git add -A
          git commit -m 'Centra y ordena selector de Partidas'
          git push origin HEAD:main
