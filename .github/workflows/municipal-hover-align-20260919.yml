name: Corregir hover municipal sin doble fondo
on:
  push:
    paths:
      - .github/workflows/municipal-hover-align-20260919.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Sustituir reglas municipales repetidas y actualizar caché
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('site.css')
          css=p.read_text(encoding='utf-8')
          marker='/* Tarjeta municipal final:'
          assert css.count(marker)==1, 'No se encontró el bloque municipal esperado'
          original=css.split(marker,1)[0].rstrip()
          corrected='''

/* Un solo botón municipal. Coordenadas medidas sobre el PNG original de 1993x789:
   x=757..1237, y=584..667. No ampliar ni desplazar el fondo: eso producía
   los dos botones y el fondo verde que sobresalía al pasar el mouse. */
body[data-view="home"] .home-catalog .home-municipal-entry{
  position:relative!important;display:block!important;grid-column:1/-1!important;
  order:3!important;width:100%!important;max-width:740px!important;
  min-height:0!important;aspect-ratio:2.83!important;
  margin:4px auto 0!important;padding:0!important;overflow:hidden!important;
  border:0!important;border-radius:12px!important;
  background:#f2fcff url("https://static.wixstatic.com/media/f3de14_b18f1125127b4cc0a399602aa63de1b2~mv2.png") center / 100% 100% no-repeat!important;
  box-shadow:0 4px 13px rgba(8,42,71,.14)!important;
  color:#082a47!important;text-decoration:none!important;cursor:pointer!important;
  transform:none!important;
}
body[data-view="home"] .home-catalog .home-municipal-entry>img,
body[data-view="home"] .home-catalog .home-municipal-entry>span{display:none!important}
body[data-view="home"] .home-catalog .home-municipal-entry>b{
  position:absolute!important;left:37.82%!important;top:73.78%!important;
  box-sizing:border-box!important;width:24.4%!important;height:11.25%!important;
  min-width:0!important;min-height:0!important;margin:0!important;
  display:flex!important;align-items:center!important;justify-content:center!important;
  padding:0 2px!important;border:4px solid transparent!important;border-radius:999px!important;
  background:#087c47!important;color:#fff!important;box-shadow:none!important;
  font-size:clamp(9px,1.05vw,13px)!important;font-weight:800!important;
  line-height:1.1!important;text-align:center!important;white-space:nowrap!important;
  opacity:0!important;transition:opacity .1s ease,color .1s ease,border-color .1s ease!important;
}
body[data-view="home"] .home-catalog .home-municipal-entry:hover{
  outline:0!important;box-shadow:0 4px 13px rgba(8,42,71,.14)!important;
  transform:none!important;
}
body[data-view="home"] .home-catalog .home-municipal-entry:focus-visible{
  outline:2px solid #050505!important;outline-offset:2px!important;transform:none!important;
}
body[data-view="home"] .home-catalog .home-municipal-entry>b:hover,
body[data-view="home"] .home-catalog .home-municipal-entry:focus-visible>b{
  opacity:1!important;background:#087c47!important;color:#050505!important;
  border-color:#050505!important;box-shadow:none!important;
}
@media(max-width:760px){
  body[data-view="home"] .home-catalog .home-municipal-entry>b{
    font-size:clamp(8px,1.8vw,11px)!important;
  }
}
'''
          updated=original+corrected
          assert updated.count('.home-municipal-entry>b{')==2
          assert '.home-municipal-entry::before' not in updated
          assert '105.5% 118%' not in updated
          p.write_text(updated,encoding='utf-8')
          p=Path('index.html')
          html=p.read_text(encoding='utf-8')
          old='site.css?v=20260919-municipal-approved-image-one-control'
          assert html.count(old)==1, 'La URL del CSS cambió; no aplicar una edición ciega'
          p.write_text(html.replace(old,'site.css?v=20260919-municipal-hover-aligned-v1',1),encoding='utf-8')
          print('PASS: una regla, imagen sin zoom, boton alineado y CSS con nueva versión')
          PY
          node --check promos.js
          node tests/municipal-route.mjs
          git add site.css index.html
          git rm .github/workflows/municipal-hover-align-20260919.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Eliminar doble fondo en hover municipal y renovar caché'
          git push