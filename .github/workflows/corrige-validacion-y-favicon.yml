name: Corrige validacion y favicon
on:
  push:
    paths:
      - '.github/workflows/corrige-validacion-y-favicon.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Corregir patrón HTML y favicon
        run: |
          python3 -c 'from pathlib import Path; p=Path("app.js"); s=p.read_text(encoding="utf-8"); old="[0-9\\\\s-]*"; new="[0-9\\\\s\\\\-]*"; assert old in s; p.write_text(s.replace(old,new),encoding="utf-8")'
          python3 -c 'from pathlib import Path; files=list(Path(".").glob("*.html")); [(lambda p,s: p.write_text(s.replace("</title>","</title>\n  <link rel=\"icon\" href=\"assets/logo-tramipago.webp\" type=\"image/webp\" />",1),encoding="utf-8") if "rel=\"icon\"" not in s else None)(p,p.read_text(encoding="utf-8")) for p in files]'
          sed -i "s|app.js?v=20260909-audit1|app.js?v=20260909-audit2|" index.html
          grep -F '[0-9\\s\\-]*' app.js
          node --check app.js
          git diff --check
      - name: Publicar
        run: |
          rm -f .github/workflows/corrige-validacion-y-favicon.yml
          git config user.name tramipago2026
          git config user.email tramipago@gmail.com
          git add -A
          git commit -m 'Corrige validación de campos numéricos y favicon'
          git push origin HEAD:main
