name: Restaurar cabecera y pie municipal (una vez)
on:
  push:
    paths:
      - .github/workflows/municipal-compact-header-footer-20260920.yml
permissions:
  contents: write
jobs:
  municipal-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Recuperar la cabecera y el pie completos y compactar la selección municipal
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('municipales.html')
          html=p.read_text(encoding='utf-8')
          old_intro='Atención y tramitación con TramiPago 100 % online para vos. Elegí el municipio y consultá por partida municipal o estado de deuda. Antes de aceptar la gestión confirmamos si el documento puede obtenerse y si el organismo exige presencialidad; no ofrecemos multas ni gestiones ante el Juzgado de Faltas.'
          assert html.count(old_intro)==1, 'La introducción cambió; no modificar a ciegas'
          html=html.replace(old_intro,'Atención 100 % online con TramiPago. Elegí tu municipio y consultá por partida municipal o estado de deuda.',1)
          old_header='<header><div class="wrap"><a href="index.html#/" aria-label="Volver al inicio de TramiPago"><img src="assets/logo-tramipago.webp" alt="TramiPago"></a><nav aria-label="Navegación"><a href="index.html#/">Volver al inicio</a></nav></div></header>'
          assert html.count(old_header)==1, 'Cabecera anterior no coincide'
          new_header='''<header class="tp-header"><div class="tp-header-inner">
            <div class="tp-brand-group"><a class="tp-brand" href="index.html#/" aria-label="TramiPago, inicio"><img src="assets/logo-tramipago.webp" alt="TramiPago"></a><a class="tp-lawyer" href="index.html#/familia/atencion-abogado" aria-label="Abogado especialista en reclamos de ART"><span><strong>Abogado</strong><small>Especialista en<br>reclamos de ART</small></span><img src="assets/abogado-art-visual.svg" alt="" aria-hidden="true"></a></div>
            <div class="tp-slogan"><strong>Resolvé tus trámites</strong><span>sin vueltas</span><small>Todo más fácil y claro.</small></div>
            <nav class="tp-main-nav" aria-label="Navegación principal"><a class="tp-home" href="index.html#/">Inicio</a><a class="tp-tracking" href="index.html#/seguimiento">Estado</a><a class="tp-help" href="https://wa.me/5491167083232" target="_blank" rel="noopener noreferrer">Ayuda</a></nav>
          </div></header>'''
          html=html.replace(old_header,new_header,1)
          old_footer='<footer><div class="wrap"><span>© 2026 TramiPago · Asistencia privada</span><a href="index.html#/">Inicio</a><a href="politica-privacidad.html">Privacidad</a><a href="terminos-condiciones.html">Términos y condiciones</a></div></footer>'
          assert html.count(old_footer)==1, 'Pie anterior no coincide'
          new_footer='''<footer class="tp-footer" aria-label="Enlaces y condiciones de TramiPago"><div class="tp-footer-inner">
            <div class="tp-footer-grid">
              <section><h2>TRAMIPAGO</h2><a href="tramites.html#como-funciona">Cómo funciona</a><a href="tramites.html">Todos los trámites</a><a href="opiniones.html">Opiniones</a></section>
              <section><h2>TRÁMITES</h2><a href="index.html#/tramite/antecedentes-penales">Antecedentes Penales</a><a href="index.html#/tramite/constancias-anses">ANSES</a><a href="index.html#/familia/arca-monotributo">ARCA</a><a href="index.html#/tramite/informe-vehicular">Informe Vehicular</a><a href="index.html#/tramite/arba-inmobiliario">ARBA / Inmobiliario</a><a href="index.html#/familia/partidas-pba">Partidas</a><a href="index.html#/tramite/asistencia-digital">Asistencia Digital</a></section>
              <section><h2>ATENCIÓN</h2><a href="contacto.html">Contacto</a><a href="index.html#/seguimiento">Estado del trámite</a><a href="https://wa.me/5491167083232" target="_blank" rel="noopener noreferrer">WhatsApp</a></section>
              <section><h2>LEGAL</h2><a href="politica-privacidad.html">Política de Privacidad</a><a href="terminos-condiciones.html">Términos y Condiciones</a><a href="arrepentimiento.html">BOTÓN DE ARREPENTIMIENTO</a><a href="baja-servicio.html">BOTÓN DE BAJA DE SERVICIO</a><a href="https://www.argentina.gob.ar/servicio/iniciar-un-reclamo-ante-defensa-del-consumidor" target="_blank" rel="noopener noreferrer">Defensa del Consumidor</a></section>
            </div><div class="tp-footer-bottom"><span>© 2026 TramiPago · Todos los derechos reservados</span><span>CUIT 20-25988733-0 · tramipago@gmail.com</span></div>
          </div></footer>'''
          html=html.replace(old_footer,new_footer,1)
          new_css='''
          /* Cabecera y pie restaurados, consistentes con la portada de TramiPago. */
          body{min-height:100vh;display:flex;flex-direction:column}
          .tp-header{background:#102e49;color:white;box-shadow:0 3px 10px rgba(8,42,71,.15)}
          .tp-header-inner{width:min(1240px,calc(100% - 32px));margin:auto;min-height:100px;display:grid;grid-template-columns:minmax(280px,1fr) auto minmax(280px,1fr);gap:20px;align-items:center}
          .tp-brand-group{display:flex;align-items:center;gap:19px;min-width:0}
          .tp-brand{display:block;flex:0 0 75px}.tp-brand img{display:block;width:75px;height:75px;object-fit:contain}
          .tp-lawyer{min-width:0;width:245px;height:72px;display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 10px;border:1px solid #050505;border-radius:11px;background:#1c2934;color:white;text-decoration:none;box-shadow:0 3px 8px rgba(0,0,0,.25)}
          .tp-lawyer strong{display:block;font-size:1.2rem;line-height:1.1}.tp-lawyer small{display:block;margin-top:3px;color:#f6d58b;font-size:.76rem;font-weight:800;line-height:1.2}.tp-lawyer img{width:53px;height:53px;object-fit:contain}
          .tp-lawyer:hover,.tp-lawyer:focus-visible{border-color:#f6d58b;outline:2px solid #f6d58b}
          .tp-slogan{text-align:center;line-height:1.08;white-space:nowrap}.tp-slogan strong,.tp-slogan span,.tp-slogan small{display:block}.tp-slogan strong{font-size:clamp(1.17rem,2vw,1.65rem);font-weight:900}.tp-slogan span{color:#29b6f6;font-size:clamp(1.45rem,2.3vw,2rem);font-weight:900}.tp-slogan small{margin-top:3px;font-size:.76rem}
          .tp-main-nav{display:flex;justify-self:end;justify-content:flex-end;gap:7px;border-left:1px solid #526b7e;padding-left:13px}
          .tp-main-nav a{width:94px;min-height:36px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:2px solid #050505;border-radius:9px;box-shadow:0 3px 7px rgba(0,0,0,.27);font-size:.81rem;font-weight:800;color:#082a47}
          .tp-main-nav .tp-home{background:#fff}.tp-main-nav .tp-tracking{background:#1888dc;color:#fff}.tp-main-nav .tp-help{background:#15834a;color:#fff}
          .tp-main-nav a:hover,.tp-main-nav a:focus-visible{color:#050505!important;border-color:#050505;box-shadow:0 4px 10px rgba(0,0,0,.35);outline:2px solid #29b6f6;outline-offset:1px}
          main.wrap{flex:1 0 auto;width:min(1050px,calc(100% - 30px))}
          .intro{padding:13px 0 3px}.intro h1{font-size:clamp(1.45rem,2.5vw,1.9rem);margin:0 0 2px}.intro p{max-width:850px;font-size:.89rem;line-height:1.35}
          .municipal-picker{max-width:760px;margin:12px auto 13px;padding:13px 17px}.municipal-picker h2{margin-bottom:1px;font-size:1.24rem}.municipal-picker p{margin-bottom:7px;font-size:.83rem}
          .municipal-picker fieldset{gap:10px;margin-bottom:9px}.municipal-picker legend{margin-bottom:3px;font-size:.81rem}.municipal-choice{min-height:45px;padding:7px 11px;font-size:.92rem}.municipal-choice input{width:18px;height:18px}.municipal-continue{min-height:38px;padding:5px 12px;font-size:.9rem}
          .towns{margin:9px auto 13px}.note{display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;margin:8px auto 12px;padding:9px 13px}.note h2{margin:0;font-size:.85rem}.note p{margin:0;font-size:.79rem;line-height:1.35}
          .tp-footer{margin-top:auto;padding:12px 0 7px;background:#102e49;color:#fff}
          .tp-footer-inner{width:min(1170px,calc(100% - 36px));margin:auto}.tp-footer-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 44px}
          .tp-footer-grid section{text-align:left;min-width:0}.tp-footer-grid h2{color:#fff;font-size:.72rem;margin:0 0 5px}.tp-footer-grid a{display:block;margin:2px 0;color:#f2f7fb;text-decoration:none;font-size:.73rem;line-height:1.24;overflow-wrap:anywhere}
          .tp-footer-grid a:hover,.tp-footer-grid a:focus-visible{color:#29b6f6;text-decoration:underline}
          .tp-footer-bottom{display:flex;justify-content:space-between;flex-wrap:wrap;gap:5px 16px;margin-top:10px;padding-top:6px;border-top:1px solid #557186;font-size:.66rem;color:#e6eef4}
          @media(max-width:1060px){.tp-header-inner{grid-template-columns:minmax(260px,1fr) auto;gap:12px;min-height:90px}.tp-slogan{display:none}.tp-lawyer{width:220px}.tp-main-nav{grid-column:2}}
          @media(max-width:700px){.tp-header-inner{grid-template-columns:1fr;justify-items:center;padding:8px 0;gap:8px}.tp-brand-group{justify-self:center}.tp-brand,.tp-brand img{width:55px;height:55px;flex-basis:55px}.tp-lawyer{height:60px;width:210px}.tp-lawyer img{width:42px;height:42px}.tp-main-nav{grid-column:1;justify-self:center;width:min(440px,100%);padding-left:0;border-left:0}.tp-main-nav a{flex:1;width:auto}.tp-footer-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:15px 22px}.tp-footer-bottom{display:block}.tp-footer-bottom span{display:block;margin:3px 0}}
          @media(max-width:450px){.tp-footer-grid{gap:12px}.tp-footer-grid a{font-size:.68rem}.municipal-picker{padding:12px}.municipal-choice{min-height:45px}}
          '''
          assert html.count('</style>')==1
          html=html.replace('</style>',new_css+'\n</style>',1)
          for required in ['href="index.html#/seguimiento"','href="arrepentimiento.html"','href="baja-servicio.html"','href="terminos-condiciones.html"','href="politica-privacidad.html"','id="elegir-municipio"','id="municipio-san-miguel"','id="municipio-jose-paz"']:
            assert required in html, 'Falta elemento requerido: '+required
          assert old_intro not in html
          assert html.count('<header class="tp-header">')==1 and html.count('<footer class="tp-footer"')==1
          p.write_text(html,encoding='utf-8')
          print('PASS: frase eliminada, selector conservado, portada compactada, cabecera con 3 botones y abogado, pie completo de 4 columnas y enlaces legales conservados')
          PY
      - name: Validar recursos y enlace de navegación
        run: |
          node tests/site-integrity.mjs
          node tests/municipal-route.mjs
      - name: Subir página municipal exclusivamente
        run: |
          git add municipales.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Restaurar cabecera y pie completos y compactar formulario municipal'
          git push