name: Auditoria final 3x
on:
  push:
    paths:
      - .github/workflows/auditoria-final-3x.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash scripts/final-cleanup.sh
