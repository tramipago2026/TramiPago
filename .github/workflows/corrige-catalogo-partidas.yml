name: Actualiza catalogo Partidas
on:
  push:
    paths:
      - '.github/workflows/corrige-catalogo-partidas.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Actualizar enlaces y texto de Partidas
        run: |
          sed -i 's|<h2>Partidas PBA</h2>|<h2>Partidas PBA / CABA</h2>|g' tramites.html
          sed -i 's|<p>Nacimiento, matrimonio, unión convivencial y defunción.</p>|<p>Nacimiento, matrimonio, unión convivencial y defunción en PBA y CABA.</p>|g' tramites.html
          sed -i 's|<div class="meta"><span class="pill price">Con datos · $15.000</span><span class="pill price">Sin datos · $20.000</span></div><a class="action" href="index.html#/tramite/partidas">Iniciar</a>|<div class="meta"><span class="pill">PBA / CABA</span></div><a class="action" href="index.html#/familia/partidas-pba">Elegir jurisdicción</a>|g' tramites.html
          sed -i 's|<a href="index.html#/tramite/partidas">Partidas PBA</a>|<a href="index.html#/familia/partidas-pba">Partidas</a>|g' tramites.html
          grep -F 'index.html#/familia/partidas-pba' tramites.html
          git diff --check
      - name: Publicar
        run: |
          rm -f .github/workflows/corrige-catalogo-partidas.yml
          git config user.name tramipago2026
          git config user.email tramipago@gmail.com
          git add -A
          git commit -m 'Actualiza catálogo de Partidas para PBA y CABA'
          git push origin HEAD:main
