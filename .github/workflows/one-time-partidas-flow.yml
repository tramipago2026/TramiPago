name: One-time Partidas flow fix

on:
  push:
    paths:
      - '.github/workflows/one-time-partidas-flow.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Partidas patch
        shell: bash
        run: |
          python .github/patch-partidas.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js services.js .github/workflows/one-time-partidas-flow.yml .github/patch-partidas.py
          git commit -m 'Fix Partidas selection flow'
          git push
