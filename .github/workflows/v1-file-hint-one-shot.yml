name: Corrección acotada de formulario y cache visual en rama
on:
  push:
    branches:
      - work/tramipago-v1-audit-20260920
    paths:
      - .github/workflows/v1-file-hint-one-shot.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Corrección literal con anclas verificadas; nada en producción
        run: node scripts/v1-fix-duplicate-file-hint.mjs
      - name: Sintaxis, enlaces, catálogo y regresión
        run: |
          node --check site-fixes.js
          node tests/site-integrity.mjs
          node tests/v1-all-links-whatsapp.mjs
          node tests/catalog-form-contract.mjs
          git diff --check
      - name: Registrar solamente cuatro archivos acotados en rama
        run: |
          git add index.html site.css site-fixes.js
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Corregir ayuda PDF duplicada y versionar CSS de botones visibles'
          git push
