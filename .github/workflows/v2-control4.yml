name: TramiPago V2 CONTROL 4

on:
  push:
    branches:
      - v2/opcion-c-directiva13
    paths:
      - v2/**
      - .github/workflows/v2-control4.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control4:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify request progress render regression
        run: node v2/tests/progress-v2.test.mjs
      - name: Verify keyboard skip and expired MFA recovery
        run: node v2/tests/skip-admin-recovery.test.mjs
      - name: Verify Admin valid status transitions
        run: node v2/tests/admin-status-regression.test.mjs
      - name: Verify private payment proof retry
        run: node v2/tests/payment-retry-regression.test.mjs
      - name: Verify Admin asynchronous request selection
        run: node v2/tests/admin-async-regression.test.mjs
      - name: Verify legal request contact actions
        run: node v2/tests/legal-actions.test.mjs
      - name: Verify tracking recovery and error handling
        run: node v2/tests/tracking-v2.test.mjs
      - name: Verify empty search without unnecessary requests
        run: node v2/tests/search-empty.test.mjs
      - name: Verify all request flow states
        run: node v2/tests/flow-states.test.mjs
      - name: Verify visual unity contract across V2 templates
        run: node v2/tests/unidad-visual-v2.test.mjs
      - name: Validate shared shell consistency
        run: node v2/scripts/build-shell.mjs --check
      - name: Validate isolated V2 routes and functional shells
        run: node v2/tests/control4.mjs
      - name: Verify V2 staging SEO isolation on all HTML pages
        run: node v2/tests/seo-staging.test.mjs
