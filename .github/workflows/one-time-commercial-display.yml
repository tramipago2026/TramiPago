name: One-time commercial display

on:
  push:
    paths:
      - '.github/workflows/one-time-commercial-display.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide official fees and clean hidden fields
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app=Path('app.js')
          text=app.read_text(encoding='utf-8')
          replacement=r'''  function renderServiceSummary(service) {
    return `
      <div class="service-summary">
        ${(service.components || []).length ? `
          <div class="service-summary-block">
            <h3>Incluye</h3>
            <ul class="requirements">${service.components.map((item) => `<li>${escapeHTML(item)}</li>`).join("")}</ul>
          </div>
        ` : ""}
        <div class="service-summary-block">
          <h3>Requisitos</h3>
          <ul class="requirements">${(service.requirements || []).map((item) => `<li>${escapeHTML(item)}</li>`).join("")}</ul>
        </div>
        ${service.intakeOnly ? "" : `<div class="service-summary-block">
          <h3>Precio del servicio</h3>
          ${renderPriceOptions(service)}
        </div>`}
      </div>
    `;
  }

  const PARTIDAS_TYPE_CARDS'''
          text,n=re.subn(r'  function renderServiceSummary\(service\) \{[\s\S]*?\n  \}\n\n  const PARTIDAS_TYPE_CARDS',replacement,text,count=1)
          if n!=1: raise SystemExit(f'app replacement count={n}')
          app.write_text(text,encoding='utf-8')

          extra=Path('extra-families.js')
          et=extra.read_text(encoding='utf-8')
          et=et.replace('        {id:"serviceOption",label:"Servicio",type:"hidden",required:false,value:"gestion"},\n','')
          extra.write_text(et,encoding='utf-8')

          Path('.github/workflows/one-time-commercial-display.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js extra-families.js .github/workflows/one-time-commercial-display.yml
          git commit -m 'Muestra solo precio comercial de TramiPago'
          git push