name: Partidas selector upgrade
on:
  push:
    paths:
      - 'scripts/upgrade_partidas_selector.py'
      - '.github/workflows/partidas-selector-upgrade.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar selector de jurisdicción y tipos de partida
        run: python scripts/upgrade_partidas_selector.py
      - name: Validar JavaScript y diff
        run: |
          node --check app.js
          node --check services.js
          git diff --check
      - name: Publicar cambios
        run: |
          git config user.name 'tramipago2026'
          git config user.email 'tramipago@gmail.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Sin cambios'
            exit 0
          fi
          git commit -m 'Reestructura Partidas por jurisdicción y tipo'
          git push origin HEAD:main
