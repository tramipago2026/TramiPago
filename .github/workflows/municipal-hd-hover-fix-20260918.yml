name: Ajustar tarjeta municipal HD y botón (una vez)
on:
  push:
    paths:
      - .github/workflows/municipal-hd-hover-fix-20260918.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Cambiar solo imagen municipal, hover de botón y caché
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('site.css');s=p.read_text(encoding='utf-8')
          old='background:#f2fcff url("assets/municipal-20260918.avif") center center / 105.4% 118% no-repeat!important;'
          new='background:#f2fcff url("https://static.wixstatic.com/media/f3de14_1b4997be000d4fc59e190a647b19f4dd~mv2.png") center center / 100% 100% no-repeat!important;'
          assert s.count(old)==1,'imagen municipal previa no coincide'
          s=s.replace(old,new,1)
          old='body[data-view="home"] .home-catalog .home-municipal-entry:hover>b,\nbody[data-view="home"] .home-catalog .home-municipal-entry:focus-visible>b{'
          new='body[data-view="home"] .home-catalog .home-municipal-entry>b:hover,\nbody[data-view="home"] .home-catalog .home-municipal-entry:focus-visible>b{'
          assert s.count(old)==1,'regla hover municipal previa no coincide'
          s=s.replace(old,new,1)
          # Imagen maestra 1983 x 793: la tarjeta completa utiliza su proporción natural.
          old='aspect-ratio:2.83!important;'
          assert s.count(old)==2
          s=s.replace(old,'aspect-ratio:1983/793!important;')
          # Centrar botón real superpuesto sobre el botón de la imagen sin cambiar el resto.
          s=s.replace('left:35.15%!important;top:78.1%!important;','left:35.15%!important;top:78.1%!important;',1)
          p.write_text(s,encoding='utf-8')
          p=Path('index.html');s=p.read_text(encoding='utf-8')
          old='site.css?v=20260918-municipal-card-live';new='site.css?v=20260918-municipal-hd-button-white'
          assert s.count(old)==1,'versión de css de portada cambió'
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          p=Path('tests/municipal-route.mjs');s=p.read_text(encoding='utf-8')
          old="assert.match(styles,/municipal-20260918\\.avif/,'Imagen nueva usada por la tarjeta municipal');"
          new="assert.match(styles,/f3de14_1b4997be000d4fc59e190a647b19f4dd~mv2\\.png/,'Imagen HD usada por la tarjeta municipal');"
          assert s.count(old)==1,'test de imagen original cambió'
          s=s.replace(old,new,1)
          old="assert.match(styles,/home-municipal-entry:hover>b/,'Texto del botón cambia al pasar el cursor');"
          new="assert.match(styles,/home-municipal-entry>b:hover/,'Texto del botón cambia al pasar sobre el botón');"
          assert s.count(old)==1,'test hover original cambió'
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check promos.js
          node tests/municipal-route.mjs
          git add site.css index.html tests/municipal-route.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Usar foto municipal original HD y botón blanco sin borde con hover negro'
          git push