name: Generar favicon PNG temporal

on:
  push:
    branches: [control3-google-favicon-20261004]

permissions:
  contents: write

jobs:
  generate-favicon:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: control3-google-favicon-20261004
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Convertir el logo existente a PNG cuadrado
        run: |
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path("assets/logo-tramipago.webp")
          target = Path("favicon.png")
          with Image.open(source) as im:
              im = im.convert("RGBA")
              side = max(im.width, im.height)
              canvas = Image.new("RGBA", (side, side), (0, 0, 0, 0))
              canvas.alpha_composite(im, ((side-im.width)//2, (side-im.height)//2))
              canvas.resize((96, 96), Image.Resampling.LANCZOS).save(target, "PNG", optimize=True)

          index = Path("index.html")
          text = index.read_text(encoding="utf-8")
          old = '<link rel="icon" href="assets/logo-tramipago.webp" type="image/webp" />'
          new = '<link rel="icon" href="/favicon.png" type="image/png" sizes="96x96" />'
          if old not in text and new not in text:
              raise SystemExit("No se encontró la referencia esperada del favicon")
          index.write_text(text.replace(old, new), encoding="utf-8")

          with Image.open(target) as check:
              assert check.format == "PNG"
              assert check.size == (96, 96)
          PY
      - name: Confirmar sólo los cambios técnicos esperados
        run: |
          git status --short
          git diff -- index.html
      - name: Guardar favicon generado en la rama de prueba
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add favicon.png index.html
          if git diff --cached --quiet; then
            echo "Sin cambios pendientes"
            exit 0
          fi
          git commit -m "Generar favicon PNG compatible con Google [favicon-generated]"
          git push origin HEAD:control3-google-favicon-20261004
