name: One-time secure tracking

on:
  push:
    paths:
      - '.github/workflows/one-time-secure-tracking.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden public tracking UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # app.js: código local con sufijo aleatorio de 8 hex; el servidor sigue siendo la fuente definitiva.
          p=Path('app.js')
          text=p.read_text(encoding='utf-8')
          old='''  function buildCode(prefix) {\n    const current = Number(localStorage.getItem(COUNTER_KEY) || "0") + 1;\n    localStorage.setItem(COUNTER_KEY, String(current));\n    return `${prefix}-${String(current).padStart(6, "0")}`;\n  }'''
          new='''  function buildCode(prefix) {\n    const current = Number(localStorage.getItem(COUNTER_KEY) || "0") + 1;\n    localStorage.setItem(COUNTER_KEY, String(current));\n    const bytes = new Uint8Array(4);\n    if (window.crypto?.getRandomValues) window.crypto.getRandomValues(bytes);\n    else for (let i = 0; i < bytes.length; i += 1) bytes[i] = Math.floor(Math.random() * 256);\n    const suffix = Array.from(bytes, (byte) => byte.toString(16).padStart(2, "0")).join("").toUpperCase();\n    return `${prefix}-${String(current).padStart(6, "0")}-${suffix}`;\n  }'''
          if old not in text: raise SystemExit('app.js buildCode anchor not found')
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')

          # security-hardening.js: consultar sólo por endpoint seguro + último 4 del WhatsApp y mostrar estado mínimo.
          p=Path('security-hardening.js')
          text=p.read_text(encoding='utf-8')
          text=text.replace('codeInput.placeholder="AP-000012";','codeInput.placeholder="AP-000012-A1B2C3D4";',1)
          text=text.replace('''  const STATUS_LABELS={\n    awaiting_payment:"Pago pendiente",\n    payment_review:"Pago en revisión",\n    payment_confirmed:"Pago confirmado",\n    in_progress:"En proceso",\n    needs_info:"Falta información",\n    finalized:"Finalizado"\n  };''','''  const STATUS_LABELS={\n    awaiting_payment:"Pago pendiente",\n    payment_review:"Pago en revisión",\n    payment_confirmed:"Pago confirmado",\n    in_progress:"Trámite en proceso",\n    needs_info:"Requiere información adicional",\n    finalized:"Trámite finalizado"\n  };''',1)

          secure_pattern=re.compile(r'''  async function secureLookup\(code,last4\)\{.*?\n  \}\n\n  function redactFinalizedLocalRequest''',re.S)
          secure_repl='''  async function secureLookup(code,last4){\n    const client=backendClient();\n    if(!client)throw new Error("backend_not_ready");\n    const {data,error}=await client.functions.invoke("track-request",{\n      body:{\n        code:String(code||"").trim().toUpperCase(),\n        last4:digits(last4).slice(-4)\n      }\n    });\n    if(error)throw error;\n    if(!data?.ok)return null;\n    return {tracking_code:data.code,status:data.status};\n  }\n\n  function redactFinalizedLocalRequest'''
          text,n=secure_pattern.subn(secure_repl,text,count=1)
          if n!=1: raise SystemExit(f'secureLookup replacement count={n}')

          render_pattern=re.compile(r'''  function renderServerStatus\(row,localRequest\)\{.*?\n  \}\n\n  function showTrackingError''',re.S)
          render_repl='''  function renderServerStatus(row,localRequest){\n    const panel=document.querySelector(".tracking-result");\n    if(!panel)return;\n    const uiStatus=DB_TO_UI[row.status]||row.status;\n    const localId=localRequest?.id||"";\n    const canCorrect=uiStatus==="needs_info"&&localRequest&&localTokenMeta(localRequest);\n    const canResume=uiStatus==="payment_pending"&&localRequest&&localTokenMeta(localRequest);\n    panel.innerHTML=`\n      <div class="status-header">\n        <div><p class="eyebrow">${escapeHTML(row.tracking_code)}</p><h2>Estado del trámite</h2></div>\n        <span class="status-badge">${escapeHTML(STATUS_LABELS[row.status]||"Estado pendiente")}</span>\n      </div>\n      <p class="text-small">Por seguridad, esta consulta no muestra nombre, DNI, correo, domicilio ni otros datos personales.</p>\n      ${canCorrect?`<div class="needs-info-box"><strong>Requiere información adicional.</strong><p>Ingresá desde este dispositivo para completar lo solicitado.</p><button class="button button-primary" type="button" data-action="correct-request" data-request-id="${escapeHTML(localId)}">Completar información</button></div>`:""}\n      ${canResume?`<div class="needs-info-box"><strong>Pago pendiente.</strong><p>Podés continuar con el mismo código desde este dispositivo.</p><button class="button button-primary" type="button" data-action="resume-payment" data-request-id="${escapeHTML(localId)}">Continuar con el pago</button></div>`:""}\n    `;\n  }\n\n  function showTrackingError'''
          text,n=render_pattern.subn(render_repl,text,count=1)
          if n!=1: raise SystemExit(f'renderServerStatus replacement count={n}')
          p.write_text(text,encoding='utf-8')

          # backend-sync.js: el seguimiento público queda exclusivamente a cargo del módulo seguro.
          p=Path('backend-sync.js')
          text=p.read_text(encoding='utf-8')
          text=text.replace('if(input)input.placeholder="AP-000012";','if(input)input.placeholder="AP-000012-A1B2C3D4";',1)
          text=text.replace('    installTrackingInterceptor();\n','',1)
          p.write_text(text,encoding='utf-8')

          # cache busting para forzar la versión nueva.
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          text=re.sub(r'app\.js\?v=[^"\']+', 'app.js?v=20260915-secure-tracking1', text, count=1)
          text=re.sub(r'security-hardening\.js\?v=[^"\']+', 'security-hardening.js?v=20260915-secure-tracking1', text, count=1)
          text=re.sub(r'backend-sync\.js\?v=[^"\']+', 'backend-sync.js?v=20260915-secure-tracking1', text, count=1)
          p.write_text(text,encoding='utf-8')

          Path('.github/workflows/one-time-secure-tracking.yml').unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js security-hardening.js backend-sync.js index.html .github/workflows/one-time-secure-tracking.yml
          git commit -m "Endurece seguimiento público y restaura códigos aleatorios"
          git push
