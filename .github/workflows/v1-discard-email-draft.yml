name: Retirar borrador de correo no aprobado
on:
  push:
    branches:
      - work/tramipago-v1-audit-20260920
    paths:
      - .github/workflows/v1-discard-email-draft.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Descartar únicamente email no solicitado
        run: node scripts/v1-discard-email-draft.mjs
      - name: Regresión completa de enlaces, diseño y contratos
        run: |
          node --check backend-sync.js
          node --check whatsapp-context.js
          node tests/v1-all-links-whatsapp.mjs
          node tests/v1-fixture-audit.mjs
          node tests/v1-directives.mjs
          node tests/site-integrity.mjs
      - name: Registrar archivos acotados sin publicar
        run: |
          git add backend-sync.js index.html tests/live-site-smoke.mjs tests/v1-notification-contract.mjs supabase/config.toml supabase/functions/notify-receipt/index.ts audits/tramipago-v1-notificaciones-20260920.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Descartar aviso por email; mantener ayuda WhatsApp y pagos a revisión'
          git push
