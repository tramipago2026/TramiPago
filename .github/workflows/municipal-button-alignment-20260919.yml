name: Ajustar botón municipal una vez
on:
  push:
    paths:
      - .github/workflows/municipal-button-alignment-20260919.yml
permissions:
  contents: write
jobs:
  corregir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Alinear y corregir botón municipal sin modificar la tarjeta
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('site.css')
          css = p.read_text(encoding='utf-8')
          def replace_once(old, new):
              global css
              assert css.count(old) == 1, 'No coincide regla CSS: ' + old[:70]
              css = css.replace(old, new, 1)
          replace_once('left:35.15%!important;top:78.1%!important;', 'left:34.55%!important;top:71.05%!important;')
          replace_once('width:29.7%!important;height:18%!important;', 'box-sizing:border-box!important;width:27.55%!important;height:14.8%!important;')
          replace_once('border:2px solid transparent!important;border-radius:999px!important;', 'border:4px solid transparent!important;border-radius:999px!important;')
          replace_once('font-size:clamp(9px,1.45vw,17px)!important;font-weight:800!important;', 'font-size:clamp(9px,1.25vw,15px)!important;font-weight:800!important;')
          replace_once('border-color:#050505!important;outline:0!important;', 'border-color:#31ae8b!important;outline:0!important;')
          replace_once('box-shadow:0 0 0 2px #050505,0 6px 14px rgba(0,0,0,.28)!important;', 'box-shadow:0 4px 13px rgba(8,42,71,.14)!important;')
          p.write_text(css, encoding='utf-8')
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          old = 'site.css?v=20260918-municipal-HD-whitebutton'
          assert html.count(old) == 1, 'No coincide versión de estilos vigente'
          p.write_text(html.replace(old, 'site.css?v=20260919-municipal-button-aligned-4px', 1), encoding='utf-8')
          assert 'home-municipal-entry>b:hover' in css
          assert 'color:#050505!important;border-color:#050505!important;' in css
          print('PASS: posición corregida, texto blanco normal, borde negro 4px solo sobre botón')
          PY
          node --check promos.js
          node tests/municipal-route.mjs
          git add site.css index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Alinear botón municipal y aplicar borde negro 4px solo al hover'
          git push