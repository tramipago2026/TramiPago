<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="TramiPago: trámites online con seguimiento." />
  <title>TramiPago | Inicio</title>
  <link rel="stylesheet" href="site.css?v=20260903-1024" />
  <link rel="stylesheet" href="ui.css?v=20260903-1024" />

  <style>
    :root {
      --navy-deep: #082A47;
      --navy: #0B3D66;
      --blue-mid: #1B6FA8;
      --cyan: #29B6F6;
      --orange: #F0A93B;
      --green-action: #23A85D;
      --green-action-hover: #126B3A;
      --white: #FFFFFF;
      --black: #050505;
      --surface: #FFFFFF;
      --surface-soft: #F6FAFD;
      --success-soft: #EFFAF4;
      --text-muted: #607789;
      --shadow-soft: rgba(8, 42, 71, 0.16);
      --shadow-strong: rgba(8, 42, 71, 0.28);
      --shadow-black: rgba(5, 5, 5, 0.28);
      --focus-ring: rgba(41, 182, 246, 0.30);
      --green-ring: rgba(35, 168, 93, 0.24);
      --overlay-strong: rgba(8, 42, 71, 0.55);
      --overlay-soft: rgba(8, 42, 71, 0.08);
      --header-button-width: 108px;
      --header-button-height: 36px;
      --action-button-width: 168px;
      --action-button-height: 46px;
      --text-normal: 1rem;
      --text-secondary: .875rem;
      --text-small: .75rem;

      --ui-border: var(--navy);
      --ui-green: var(--green-action);
      --ui-green-dark: var(--green-action-hover);
      --ui-blue: var(--blue-mid);
      --ui-cyan: var(--cyan);
      --ui-yellow: var(--orange);
    }

    body {
      color: var(--navy-deep);
      background: #edf4f8;
      font-size: var(--text-normal);
    }

    .site-header {
      background: var(--navy-deep);
      border-bottom-color: var(--navy-deep);
      box-shadow: 0 3px 12px var(--shadow-soft);
    }

    .header-slogan strong { color: var(--white); }
    .header-slogan span { color: var(--cyan); }
    .header-slogan small {
      color: var(--white);
      font-size: var(--text-secondary);
    }

    .main-nav { gap: 8px; }

    .main-nav a,
    .main-nav button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      width: var(--header-button-width);
      min-width: var(--header-button-width);
      height: var(--header-button-height);
      min-height: var(--header-button-height);
      padding: 4px 8px;
      color: var(--black);
      border: 3px solid var(--black);
      border-radius: 8px;
      box-shadow: 0 4px 8px var(--shadow-black);
      font: inherit;
      font-size: var(--text-secondary);
      font-weight: 750;
      line-height: 1.05;
      text-decoration: none;
      cursor: pointer;
      flex: 0 0 var(--header-button-width);
      transition: color .16s ease, border-color .16s ease, box-shadow .16s ease, transform .16s ease;
    }

    .main-nav a.nav-home { background: var(--white); color: var(--navy-deep); }
    .main-nav a.nav-tracking { background: var(--cyan); color: var(--black); }
    .main-nav button.nav-help { background: #25D366; color: var(--navy-deep); }

    .main-nav a:hover,
    .main-nav a:focus-visible,
    .main-nav button:hover,
    .main-nav button:focus-visible,
    .main-nav a.nav-tracking:hover,
    .main-nav a.nav-tracking:focus-visible {
      color: var(--white);
      border-color: var(--white);
      box-shadow: 0 5px 10px var(--shadow-black);
      outline: none;
      transform: translateY(-1px);
    }

    .nav-icon {
      width: 15px;
      height: 15px;
      flex: 0 0 15px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: var(--action-button-width);
      min-width: var(--action-button-width);
      min-height: var(--action-button-height);
      padding: 8px 14px;
      border: 2px solid var(--black);
      border-radius: 8px;
      box-shadow: 0 4px 9px var(--shadow-black);
      font-size: .9375rem;
      font-weight: 750;
      text-align: center;
      transition: color .16s ease, border-color .16s ease, box-shadow .16s ease, transform .16s ease, background .16s ease;
    }

    .button.button-primary,
    .family-service-card .button.button-primary {
      color: var(--white);
      background: var(--blue-mid);
      border-color: var(--black);
      box-shadow: 0 4px 9px var(--shadow-black);
    }

    .button.button-primary:hover,
    .button.button-primary:focus-visible,
    .family-service-card .button.button-primary:hover,
    .family-service-card .button.button-primary:focus-visible {
      color: var(--white);
      background: #12537e;
      border-color: var(--white);
      box-shadow: 0 0 0 3px var(--focus-ring), 0 5px 11px var(--shadow-black);
      outline: none;
      transform: translateY(-1px);
    }

    .button.button-secondary {
      color: var(--navy-deep);
      background: var(--white);
      border-color: var(--black);
      box-shadow: 0 4px 9px var(--shadow-black);
    }

    .button.button-secondary:hover,
    .button.button-secondary:focus-visible {
      color: var(--white);
      background: var(--navy-deep);
      border-color: var(--white);
      box-shadow: 0 5px 11px var(--shadow-black);
      outline: none;
      transform: translateY(-1px);
    }

    .tracking-page #tracking-form .button { margin-top: 16px; }

    .site-main p,
    .site-main li,
    .site-main label,
    .site-main input,
    .site-main select,
    .site-main textarea {
      font-size: var(--text-normal);
    }

    .site-main small,
    .site-main .text-small,
    .site-main .eyebrow,
    .site-main .service-tag,
    .site-main .family-unavailable,
    .site-main .timeline-item small,
    .site-main .summary-item small {
      font-size: var(--text-secondary);
      line-height: 1.4;
    }

    .home-hero-clean {
      padding: 18px 0 10px;
      background: linear-gradient(180deg,#f8fbfd 0%,#edf4f8 100%);
    }

    .home-hero-clean .home-hero-copy h1 { color: var(--navy-deep); }

    .catalog-search-wrap {
      width: min(620px, 100%);
      margin: 18px auto 0;
    }

    .catalog-search {
      width: 100%;
      min-height: 44px;
      padding: 10px 14px;
      color: var(--navy-deep);
      background: var(--surface);
      border: 2px solid var(--navy);
      border-radius: 9px;
      box-shadow: 0 3px 10px var(--shadow-soft);
      font: inherit;
    }

    .catalog-search::placeholder { color: var(--text-muted); }

    .catalog-search:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 4px var(--focus-ring);
      outline: none;
    }

    .home-catalog {
      padding: 4px 0 22px;
      background: #edf4f8;
    }

    .home-section-title {
      margin: 10px 0 8px;
      color: var(--navy-deep);
      font-size: 1.25rem;
      text-align: center;
    }

    .home-direct-row,
    .home-family-row {
      display: grid;
      grid-template-columns: repeat(4, 154px);
      justify-content: center;
      gap: 14px;
      align-items: stretch;
    }

    .home-family-row { grid-template-columns: repeat(2, 154px); }

    .home-catalog .home-tile {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 154px;
      height: auto;
      aspect-ratio: 4 / 5;
      padding: 0;
      overflow: hidden;
      background: var(--surface);
      border: 0;
      border-radius: 9px;
      box-shadow: 0 5px 16px var(--shadow-soft);
    }

    .home-catalog .home-tile:hover,
    .home-catalog .home-tile:focus-visible {
      box-shadow: 0 0 0 3px var(--focus-ring), 0 8px 20px var(--shadow-strong);
      transform: translateY(-3px);
      outline: none;
    }

    .home-catalog .card-photo,
    .home-catalog .home-primary-logo {
      position: relative;
      display: block;
      width: 100%;
      height: 66% !important;
      flex: 0 0 66% !important;
      overflow: hidden;
      border-radius: 0;
      background-position: center;
      background-size: cover;
    }

    .home-catalog .card-photo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      transform: scale(1.01);
    }

    .catalog-card-info {
      position: relative;
      z-index: 3;
      display: flex;
      flex: 0 0 34%;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
      padding: 8px 10px;
      overflow: hidden;
      text-align: left;
      background: var(--navy-deep);
    }

    .catalog-card-title {
      display: block;
      color: var(--white);
      font-size: .875rem;
      font-weight: 800;
      line-height: 1.12;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .catalog-card-subtitle {
      display: block;
      margin-top: 3px;
      color: var(--cyan);
      font-size: .75rem;
      font-weight: 700;
      line-height: 1.18;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .catalog-card-badge {
      position: absolute;
      top: 9px;
      right: 9px;
      z-index: 5;
      padding: 5px 8px;
      color: var(--navy-deep);
      background: var(--orange);
      border: 1px solid var(--navy-deep);
      border-radius: 999px;
      font-size: var(--text-small);
      font-weight: 800;
      line-height: 1;
    }

    .home-catalog .home-tile[hidden] { display: none; }
    .home-catalog .home-section-title[hidden] { display: none; }

    .home-catalog .home-tile.is-unavailable {
      cursor: default;
      filter: saturate(.75);
      opacity: .78;
    }

    .home-catalog .home-tile.is-unavailable:hover,
    .home-catalog .home-tile.is-unavailable:focus-visible {
      box-shadow: 0 5px 16px var(--shadow-soft);
      transform: none;
    }

    .confirmation-summary,
    .finalization-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      width: 100%;
      margin: 20px 0;
    }

    .confirmation-summary-item,
    .finalization-summary-item {
      padding: 12px;
      text-align: left;
      background: var(--surface-soft);
      border: 1px solid var(--navy);
      border-radius: 8px;
    }

    .confirmation-summary-item small,
    .finalization-summary-item small {
      display: block;
      margin-bottom: 4px;
      color: var(--text-muted);
      font-size: var(--text-secondary);
    }

    .confirmation-summary-item strong,
    .finalization-summary-item strong {
      display: block;
      color: var(--navy-deep);
      font-size: var(--text-normal);
      overflow-wrap: anywhere;
    }

    .confirmation-next {
      margin: 4px auto 18px;
      max-width: 620px;
      font-size: var(--text-normal);
      line-height: 1.5;
    }

    .finalization-box {
      margin: 18px 0;
      padding: 18px;
      background: var(--success-soft);
      border: 2px solid var(--green-action);
      border-radius: 10px;
    }

    .finalization-box h3 {
      margin: 0 0 6px;
      color: var(--navy-deep);
      font-size: 1.25rem;
    }

    .finalization-box > p {
      margin: 0;
      font-size: var(--text-normal);
      line-height: 1.5;
    }

    .site-footer {
      color: var(--white);
      background: var(--navy-deep);
      border-top-color: var(--navy-deep);
      font-size: var(--text-secondary);
    }

    .site-footer .legal-links a {
      color: var(--white);
      font-size: var(--text-secondary);
      font-weight: 700;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .site-footer .legal-links a:hover,
    .site-footer .legal-links a:focus-visible {
      color: var(--cyan);
      outline-color: var(--cyan);
    }

    @media (max-width: 1040px) {
      .home-direct-row { grid-template-columns: repeat(2, 154px); }
    }

    @media (max-width: 680px) {
      .main-nav { width: 100%; gap: 6px; }
      .main-nav a,
      .main-nav button {
        width: auto;
        min-width: 0;
        height: 34px;
        min-height: 34px;
        padding: 4px 6px;
        font-size: var(--text-secondary);
        flex: 1 1 0;
      }

      .button {
        width: 100%;
        max-width: var(--action-button-width);
      }

      .home-direct-row,
      .home-family-row {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .home-catalog .home-tile { width: 100%; }

      .catalog-card-info { padding: 7px 8px; }
      .catalog-card-title { font-size: .8125rem; }
      .catalog-card-subtitle { font-size: .6875rem; }
      .confirmation-summary,
      .finalization-summary { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>

      <nav class="main-nav" aria-label="Navegación principal">

        <a class="nav-tracking" href="#/seguimiento" aria-label="Estado del trámite">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="M16 16l4 4"></path></svg>

  <main id="app" class="site-main" tabindex="-1"></main>

      <span>© 2026 TramiPago · Todos los derechos reservados</span>
      <span class="legal-links">
        <a href="politica-privacidad.html">Política de Privacidad</a>

    </div>
  </footer>

  <script src="services.js?v=20260905-1502"></script>
  <script src="app.js?v=20260905-1502"></script>
  <script>
    (function () {
      "use strict";

      const REQUESTS_KEY = "tramipago_requests_v1";
      const cardMeta = {
        "antecedentes-penales": { title: "Antecedentes Penales", subtitle: "Certificado online" },
        "constancias-anses": { title: "ANSES", subtitle: "CODEM + Negativa" },
        "arca-monotributo": { title: "ARCA / Monotributo", subtitle: "Gestiones impositivas" },
        "informe-vehicular": { title: "Informe vehicular", subtitle: "Dominio + deudas" },
        "partidas-turnos": { title: "Partidas y Turnos", subtitle: "Registro Civil" },
        "arba-inmobiliario": { title: "ARBA / Inmobiliario", subtitle: "Deuda + plancheta" }
      };

      function normalize(value) {
        return String(value || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
      }

      function readRequests() {
        try {
          return JSON.parse(localStorage.getItem(REQUESTS_KEY) || "[]");
        } catch (_) {
          return [];
        }
      }

      function getRequestByCode(code) {
        const normalized = String(code || "").trim().toUpperCase();
        return readRequests().find(function (item) {
          return String(item.code || "").toUpperCase() === normalized;
        }) || null;
      }

      function dateParts(value) {
        const date = value ? new Date(value) : new Date();
        return {
          date: new Intl.DateTimeFormat("es-AR", { dateStyle: "medium" }).format(date),
          time: new Intl.DateTimeFormat("es-AR", { timeStyle: "short" }).format(date)
        };
      }

      function escapeText(value) {
        return String(value == null ? "" : value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function updateView() {
        document.body.dataset.view = (!location.hash || location.hash === "#/") ? "home" : "inner";
      }

      function addSearch(hero) {
        if (!hero || hero.querySelector(".catalog-search")) return;
        const copy = hero.querySelector(".home-hero-copy");
        if (!copy) return;
        const wrap = document.createElement("div");
        wrap.className = "catalog-search-wrap";
        wrap.innerHTML = '<input class="catalog-search" type="search" placeholder="Buscá un trámite..." aria-label="Buscar trámite" autocomplete="off" />';
        copy.appendChild(wrap);
      }

      function decorateCard(card) {
        if (card.dataset.visualReady === "true") return;
        const id = card.dataset.serviceId || card.dataset.familyId || "";
        const meta = cardMeta[id] || { title: card.getAttribute("aria-label") || "Trámite", subtitle: "Gestión online" };
        const media = card.querySelector(".home-tile-media");
        if (media) media.classList.add("card-photo");

        const info = document.createElement("span");
        info.className = "catalog-card-info";
        info.innerHTML = '<span class="catalog-card-title"></span><span class="catalog-card-subtitle"></span>';
        info.querySelector(".catalog-card-title").textContent = meta.title;
        info.querySelector(".catalog-card-subtitle").textContent = meta.subtitle;
        card.appendChild(info);

        if (meta.badge || card.disabled) {
          const badge = document.createElement("span");
          badge.className = "catalog-card-badge";
          badge.textContent = meta.badge || "Próximamente";
          card.appendChild(badge);
        }

        card.dataset.search = normalize(meta.title + " " + meta.subtitle);
        card.dataset.visualReady = "true";
      }

      function buildCatalogSections() {
        const catalog = document.querySelector(".home-catalog .container");
        if (!catalog) return;
        catalog.querySelectorAll(".home-tile").forEach(decorateCard);
      }

      function bindSearch() {
        const input = document.querySelector(".catalog-search");
        const catalog = document.querySelector(".home-catalog .container");
        if (!input || !catalog || input.dataset.bound === "true") return;
        input.dataset.bound = "true";
        input.addEventListener("input", function () {
          const query = normalize(input.value);
          catalog.querySelectorAll(".home-tile").forEach(function (card) {
            card.hidden = Boolean(query) && !String(card.dataset.search || "").includes(query);
          });
          [".home-direct-row", ".home-family-row"].forEach(function (selector) {
            const row = catalog.querySelector(selector);
            if (!row) return;
            const title = row.previousElementSibling;
            if (title?.classList.contains("home-section-title")) {
              title.hidden = ![...row.querySelectorAll(".home-tile")].some(function (card) { return !card.hidden; });
            }
          });
        });
      }

      function removeRedundantButtons() {
        document.querySelectorAll('.process-top [data-action="back-home"], .ineligible-panel [data-action="back-home"], .family-page .family-back[data-action="back-home"]').forEach(function (button) {
          button.remove();
        });
      }

      function normalizeButtonLabels() {
        const replacements = {
          "Crear solicitud": "Siguiente",
          "Guardar y continuar": "Siguiente",
          "Guardar cambios": "Guardá cambios",
          "Volver": "Atrás",
          "Consultar": "Consultá estado",
          "Consultar estado": "Consultá estado",
          "Revisar datos": "Volver a datos",
          "Informar pago": "Informá pago",
          "Revisar requisitos": "Revisá requisitos",
          "Copiar código": "Copiá código",
          "Enviar corrección": "Enviá corrección",
          "Corregir información": "Corregí información",
          "Continuar con el pago": "Continuá con el pago",
          "Descargar resultado": "Descargá resultado",
          "Elegir trámite": "Elegí trámite",
          "Ver mi trámite": "Ver estado"
        };

        document.querySelectorAll(".button").forEach(function (button) {
          const label = button.textContent.trim();
          if (replacements[label]) button.textContent = replacements[label];
        });
      }

      function enhanceConfirmation() {
        const panel = document.querySelector(".confirmation");
        if (!panel || panel.dataset.detailsReady === "true") return;
        const codeNode = panel.querySelector(".request-code");
        const code = codeNode ? codeNode.textContent.trim() : "";
        const request = getRequestByCode(code);
        if (!request) return;

        const timestamp = dateParts(request.updatedAt || request.createdAt);
        const status = request.status === "payment_review" ? "Pago en revisión" : String(request.status || "Pendiente");
        const intro = panel.querySelector("h2 + p");
        if (intro) intro.textContent = "Recibimos tu comprobante. Guardá estos datos para consultar el estado.";

        const summary = document.createElement("div");
        summary.className = "confirmation-summary";
        summary.innerHTML =
          '<div class="confirmation-summary-item"><small>Código</small><strong>' + escapeText(request.code) + '</strong></div>' +
          '<div class="confirmation-summary-item"><small>Servicio</small><strong>' + escapeText(request.serviceName) + '</strong></div>' +
          '<div class="confirmation-summary-item"><small>Fecha</small><strong>' + escapeText(timestamp.date) + '</strong></div>' +
          '<div class="confirmation-summary-item"><small>Hora</small><strong>' + escapeText(timestamp.time) + '</strong></div>' +
          '<div class="confirmation-summary-item"><small>Estado</small><strong>' + escapeText(status) + '</strong></div>';

        const oldServiceStatus = codeNode.nextElementSibling;
        if (oldServiceStatus && oldServiceStatus.tagName === "P") oldServiceStatus.remove();
        codeNode.insertAdjacentElement("afterend", summary);

        const actions = panel.querySelector(".confirmation-actions");
        if (actions) {
          const trackingButton = actions.querySelector('[data-action="track-request"]');
          if (trackingButton) trackingButton.textContent = "Ver estado";
          const copyButton = actions.querySelector('[data-action="copy-code"]');
          if (copyButton) copyButton.textContent = "Copiá código";
        }

        panel.dataset.detailsReady = "true";
      }

      function enhanceFinalizedTracking() {
        const result = document.querySelector(".tracking-result");
        if (!result || result.dataset.finalReady === "true") return;
        const badge = result.querySelector(".status-badge");
        if (!badge || normalize(badge.textContent) !== "finalizado") return;

        const codeNode = result.querySelector(".eyebrow");
        const code = codeNode ? codeNode.textContent.trim() : "";
        const request = getRequestByCode(code);
        if (!request) return;
        const finished = dateParts(request.updatedAt || request.createdAt);

        const box = document.createElement("div");
        box.className = "finalization-box";
        box.innerHTML =
          '<h3>Trámite finalizado</h3>' +
          '<p>La gestión terminó. Conservá este código como referencia y revisá el resultado o la indicación de entrega.</p>' +
          '<div class="finalization-summary">' +
            '<div class="finalization-summary-item"><small>Código</small><strong>' + escapeText(request.code) + '</strong></div>' +
            '<div class="finalization-summary-item"><small>Servicio</small><strong>' + escapeText(request.serviceName) + '</strong></div>' +
            '<div class="finalization-summary-item"><small>Fecha de finalización</small><strong>' + escapeText(finished.date) + '</strong></div>' +
            '<div class="finalization-summary-item"><small>Hora</small><strong>' + escapeText(finished.time) + '</strong></div>' +
            '<div class="finalization-summary-item"><small>Estado</small><strong>Finalizado</strong></div>' +
          '</div>';

        const statusHeader = result.querySelector(".status-header");
        if (statusHeader) statusHeader.insertAdjacentElement("afterend", box);
        result.dataset.finalReady = "true";
      }

      function enhanceHome() {
        const hero = document.querySelector(".home-hero-clean");
        addSearch(hero);
        buildCatalogSections();
        bindSearch();
      }

      function enhanceInterface() {
        updateView();
        enhanceHome();
        removeRedundantButtons();
        normalizeButtonLabels();
        enhanceConfirmation();
        enhanceFinalizedTracking();
      }

      window.addEventListener("hashchange", function () {
        window.setTimeout(enhanceInterface, 0);
      });

      const app = document.getElementById("app");
      if (app) {
        new MutationObserver(function () {
          window.requestAnimationFrame(enhanceInterface);
        }).observe(app, { childList: true, subtree: true });
      }

      enhanceInterface();
    })();
  </script>
</body>
</html>
