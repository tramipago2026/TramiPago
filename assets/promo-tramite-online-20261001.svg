<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
<title id="title">Consultá por cualquier trámite online</title>
<desc id="desc">Publicidad de TramiPago para consultas sobre trámites online, incluyendo Migraciones, TAD, turnos y conexión de medidor de luz.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#062e52"/>
    <stop offset="0.55" stop-color="#0b4f7d"/>
    <stop offset="1" stop-color="#0d2f4a"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffe24a"/>
    <stop offset="1" stop-color="#ffb400"/>
  </linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00a83b"/>
    <stop offset="1" stop-color="#00d653"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#00182a" flood-opacity=".38"/>
  </filter>
</defs>
<rect width="1000" height="1000" rx="36" fill="url(#bg)"/>
<circle cx="855" cy="180" r="170" fill="#1f8ccc" opacity=".18"/>
<circle cx="900" cy="330" r="105" fill="#44c6ff" opacity=".10"/>
<path d="M0 760 C180 700 310 790 475 735 C640 680 760 735 1000 670 L1000 1000 L0 1000Z" fill="#041f38" opacity=".72"/>

<!-- Marca -->
<g transform="translate(55 54)" filter="url(#shadow)">
  <rect width="245" height="112" rx="28" fill="#fff" opacity=".98"/>
  <circle cx="58" cy="56" r="39" fill="#0d75d8"/>
  <rect x="38" y="32" width="40" height="48" rx="5" fill="#fff"/>
  <path d="M48 47h20M48 57h20M48 67h14" stroke="#0d75d8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="81" cy="78" r="20" fill="#16a942"/>
  <path d="m70 78 8 8 15-18" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="112" y="49" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="800" fill="#0a2650">trami</text>
  <text x="112" y="88" font-family="Arial,Helvetica,sans-serif" font-size="43" font-weight="900" fill="#09a6ef">pago</text>
</g>

<!-- Titular -->
<text x="55" y="245" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="900" fill="#fff">CONSULTÁ POR</text>
<text x="55" y="316" font-family="Arial,Helvetica,sans-serif" font-size="70" font-weight="900" fill="url(#gold)">CUALQUIER TRÁMITE</text>
<text x="55" y="380" font-family="Arial,Helvetica,sans-serif" font-size="60" font-weight="900" fill="#fff">QUE SEA ONLINE</text>
<rect x="55" y="412" width="565" height="82" rx="20" fill="#eaf7ff"/>
<text x="80" y="447" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#0b3157">Te orientamos con requisitos, documentación</text>
<text x="80" y="478" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#0b3157">y pasos para realizarlo correctamente.</text>

<!-- Lista -->
<g font-family="Arial,Helvetica,sans-serif">
  <g transform="translate(55 535)">
    <circle cx="28" cy="28" r="28" fill="#0d6aa8"/><path d="M17 28h22M28 17v22" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <text x="72" y="36" font-size="30" font-weight="800" fill="#fff">Migraciones</text>
  </g>
  <g transform="translate(55 607)">
    <circle cx="28" cy="28" r="28" fill="#0d6aa8"/><path d="M17 28h22M28 17v22" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <text x="72" y="36" font-size="30" font-weight="800" fill="#fff">TAD y trámites digitales</text>
  </g>
  <g transform="translate(55 679)">
    <circle cx="28" cy="28" r="28" fill="#0d6aa8"/><path d="M17 28h22M28 17v22" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <text x="72" y="36" font-size="30" font-weight="800" fill="#fff">Turnos online</text>
  </g>
  <g transform="translate(55 751)">
    <circle cx="28" cy="28" r="28" fill="#0d6aa8"/><path d="M17 28h22M28 17v22" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <text x="72" y="36" font-size="30" font-weight="800" fill="#fff">Conexión de medidor de luz</text>
  </g>
</g>

<!-- Ilustración -->
<g transform="translate(665 405)" filter="url(#shadow)">
  <rect x="0" y="0" width="270" height="320" rx="28" fill="#f8fcff"/>
  <rect x="36" y="38" width="198" height="30" rx="10" fill="#d7ecf8"/>
  <rect x="36" y="88" width="150" height="18" rx="9" fill="#bddced"/>
  <rect x="36" y="124" width="182" height="18" rx="9" fill="#bddced"/>
  <rect x="36" y="160" width="164" height="18" rx="9" fill="#bddced"/>
  <circle cx="204" cy="245" r="44" fill="#12b84c"/>
  <path d="m184 245 15 15 30-37" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="30" y="218" width="110" height="62" rx="14" fill="#0b6fa8"/>
  <path d="M52 250h66M52 235h45M52 265h52" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
</g>

<!-- Franja -->
<rect x="55" y="842" width="890" height="78" rx="24" fill="#dff4ff"/>
<text x="500" y="875" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#0a3158">Trámites nacionales, provinciales y municipales</text>
<text x="500" y="905" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="600" fill="#285271">Consultá y te indicamos cómo avanzar</text>

<!-- CTA -->
<rect x="55" y="936" width="890" height="50" rx="25" fill="url(#green)"/>
<text x="500" y="969" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="900" fill="#fff">CONSULTÁ AHORA POR TU TRÁMITE ONLINE</text>
</svg>