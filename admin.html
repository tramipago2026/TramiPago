<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>Panel privado | TramiPago</title>
  <link rel="icon" href="assets/logo-tramipago.webp" type="image/webp" />
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#082a47;background:#edf4f8}
    *{box-sizing:border-box}body{margin:0}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 22px;background:#082a47;color:#fff}.top img{width:124px;height:auto}.top-actions{display:flex;gap:8px;align-items:center}.wrap{width:min(1180px,94vw);margin:24px auto}.panel{background:#fff;border-radius:12px;box-shadow:0 6px 22px rgba(8,42,71,.14);padding:18px}.login{max-width:430px;margin:60px auto}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}label{font-size:.78rem;font-weight:750;color:#31566f}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:9px 10px;border:1px solid #a9c1d0;border-radius:8px;background:#fff;color:#082a47}textarea{min-height:82px;resize:vertical}.btn{border:0;border-radius:8px;padding:9px 13px;font-weight:750;cursor:pointer}.primary{background:#1b6fa8;color:#fff}.success{background:#23a85d;color:#fff}.secondary{background:#dceaf3;color:#082a47}.danger{background:#b64040;color:#fff}.toolbar{display:flex;gap:10px;align-items:end;margin-bottom:14px}.toolbar .field{flex:1}.status-line{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:0 0 14px}.muted{color:#607789;font-size:.82rem}.message{min-height:20px;margin-top:9px;font-size:.86rem}.error{color:#a61f1f}.ok{color:#177744}.requests{display:grid;gap:10px}.card{border:1px solid #ccdae3;border-radius:10px;padding:12px;background:#fff}.card-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.code{font-size:1rem;font-weight:850}.service{font-weight:700}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;background:#e5f2fa;font-size:.75rem;font-weight:750}.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 14px;margin-top:10px;font-size:.82rem}.meta strong{display:block;font-size:.72rem;color:#607789}.card-actions{display:flex;gap:8px;margin-top:10px}.editor{margin-top:12px;padding-top:12px;border-top:1px solid #d8e3ea}.editor[hidden]{display:none}.empty{text-align:center;padding:28px;color:#607789}.spinner{opacity:.65;pointer-events:none}@media(max-width:850px){.grid,.meta{grid-template-columns:1fr 1fr}.top{padding:12px}.wrap{width:min(96vw,1180px)}}@media(max-width:520px){.grid,.meta{grid-template-columns:1fr}.toolbar{align-items:stretch;flex-direction:column}.toolbar .field{width:100%}.card-head{flex-direction:column}}
  </style>
</head>
<body>
  <header class="top">
    <img src="assets/logo-tramipago.webp" alt="TramiPago" />
    <div class="top-actions"><span id="session-label" class="muted"></span><button id="logout" class="btn secondary" type="button" hidden>Cerrar sesión</button></div>
  </header>
  <main class="wrap">
    <section id="login-panel" class="panel login">
      <h1>Panel privado</h1>
      <p class="muted">Acceso exclusivo para administración de TramiPago.</p>
      <form id="login-form">
        <div class="field"><label for="email">Correo</label><input id="email" name="email" type="email" autocomplete="username" required /></div>
        <div class="field" style="margin-top:10px"><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required /></div>
        <button class="btn primary" style="margin-top:14px" type="submit">Ingresar</button>
        <div id="login-message" class="message" role="alert"></div>
      </form>
    </section>

    <section id="dashboard" hidden>
      <div class="status-line"><div><h1 style="margin:0">Trámites</h1><span id="count" class="muted"></span></div><button id="refresh" class="btn secondary" type="button">Actualizar</button></div>
      <div class="panel toolbar">
        <div class="field"><label for="search">Buscar</label><input id="search" type="search" placeholder="Código, nombre o WhatsApp" /></div>
        <div class="field" style="max-width:230px"><label for="status-filter">Estado</label><select id="status-filter"><option value="">Todos</option><option value="awaiting_payment">Pago pendiente</option><option value="payment_review">Pago en revisión</option><option value="in_progress">En proceso</option><option value="needs_info">Falta información</option><option value="finalized">Finalizado</option></select></div>
      </div>
      <div id="dashboard-message" class="message" role="status"></div>
      <div id="requests" class="requests"></div>
    </section>
  </main>
  <script src="admin.js?v=20260911-v1"></script>
</body>
</html>
