<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>Panel privado | TramiPago</title>
  <link rel="icon" href="assets/logo-tramipago.webp" type="image/webp" />
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#082a47;background:#edf4f8}
    *{box-sizing:border-box}body{margin:0}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 22px;background:#082a47;color:#fff}.top img{width:124px;height:auto}.top-actions{display:flex;gap:8px;align-items:center}.top .muted{color:#d9eaf5}.wrap{width:min(1240px,94vw);margin:24px auto}.panel{background:#fff;border-radius:12px;box-shadow:0 6px 22px rgba(8,42,71,.14);padding:18px}.login{max-width:430px;margin:60px auto}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}label{font-size:.82rem;font-weight:750;color:#31566f}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:10px 11px;border:1px solid #a9c1d0;border-radius:8px;background:#fff;color:#082a47}textarea{min-height:92px;resize:vertical}.btn{border:0;border-radius:8px;padding:10px 14px;min-height:42px;font-weight:750;cursor:pointer}.primary{background:#1b6fa8;color:#fff}.success{background:#198754;color:#fff}.secondary{background:#dceaf3;color:#082a47}.danger{background:#b64040;color:#fff}.toolbar{display:flex;gap:10px;align-items:end;margin-bottom:14px}.toolbar .field{flex:1}.status-line{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:0 0 14px}.muted{color:#607789;font-size:.86rem}.message{min-height:20px;margin-top:9px;font-size:.88rem}.error{color:#a61f1f}.ok{color:#177744}.requests{display:grid;gap:16px}.card{border:1px solid #c3d5e0;border-radius:12px;padding:16px;background:#fff;box-shadow:0 4px 14px rgba(8,42,71,.08);overflow-wrap:anywhere}.card-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.code{font-size:1.08rem;font-weight:850}.service{font-weight:750;margin-top:2px}.badge{display:inline-flex;padding:6px 10px;border-radius:999px;background:#e5f2fa;font-size:.8rem;font-weight:800;white-space:nowrap}.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 16px;margin-top:12px;font-size:.86rem}.meta strong{display:block;font-size:.74rem;color:#607789;margin-bottom:2px}.notice{margin-top:12px;padding:10px 12px;border-radius:8px;background:#fff7da;border:1px solid #edd991;font-size:.88rem}.card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.editor{margin-top:14px;padding-top:14px;border-top:1px solid #d8e3ea}.editor[hidden]{display:none}.editor h3{margin:0 0 10px}.empty{text-align:center;padding:28px;color:#607789}.spinner{opacity:.65;pointer-events:none}.full-record{margin-top:14px;border:1px solid #d5e2ea;border-radius:10px;background:#f8fbfd}.full-record>summary{cursor:pointer;font-weight:850;padding:12px 14px;list-style-position:inside}.record-section{padding:0 14px 14px}.record-section h3{margin:10px 0 8px;font-size:.96rem}.record-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.record-item{min-width:0;padding:9px 10px;border:1px solid #dbe6ed;border-radius:8px;background:#fff}.record-item strong,.record-item span,.record-item small{display:block}.record-item strong{font-size:.74rem;color:#31566f;margin-bottom:3px}.record-item span{font-size:.88rem;white-space:pre-wrap}.record-item small{font-size:.69rem;color:#7b8e9b;margin-top:4px}.file-list,.history{display:grid;gap:8px}.file-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px;border:1px solid #dbe6ed;border-radius:8px;background:#fff}.file-row strong,.file-row span,.file-row small{display:block}.file-row span{font-size:.88rem;margin-top:2px}.file-row small{font-size:.72rem;color:#607789;margin-top:3px}.history-row{padding:9px 10px;border-left:4px solid #1b6fa8;background:#fff;border-radius:6px}.history-row strong{margin-right:8px}.history-row span{font-size:.76rem;color:#607789}.history-row p{margin:5px 0 0;font-size:.84rem}.status-buttons{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 12px}.status-choice{border:1px solid #9eb9ca;background:#eef6fa;color:#082a47;border-radius:999px;padding:8px 11px;min-height:38px;font-weight:750;cursor:pointer}.status-choice.active{background:#1b6fa8;color:#fff;border-color:#1b6fa8}.internal-grid .record-item{background:#fdfefe}
    @media(max-width:900px){.record-grid,.meta{grid-template-columns:1fr 1fr}.top{padding:12px}.wrap{width:min(96vw,1240px)}}
    @media(max-width:560px){.grid,.record-grid,.meta{grid-template-columns:1fr}.toolbar{align-items:stretch;flex-direction:column}.toolbar .field{width:100%;max-width:none!important}.card-head{flex-direction:column}.file-row{align-items:flex-start;flex-direction:column}.file-row .btn{width:100%}.status-line{align-items:flex-start}.top img{width:104px}.top-actions{align-items:flex-end;flex-direction:column}.btn{min-height:44px}}
  </style>
</head>
<body>
  <header class="top">
    <img src="assets/logo-tramipago.webp" alt="TramiPago" />
    <div class="top-actions"><span id="session-label" class="muted"></span><button id="logout" class="btn secondary" type="button" hidden>Cerrar sesión</button></div>
  </header>
  <main class="wrap">
    <section id="login-panel" class="panel login">
      <h1>Panel privado</h1>
      <p class="muted">Acceso exclusivo para administración de TramiPago.</p>
      <form id="login-form">
        <div class="field"><label for="email">Correo</label><input id="email" name="email" type="email" autocomplete="username" required /></div>
        <div class="field" style="margin-top:10px"><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required /></div>
        <button class="btn primary" style="margin-top:14px" type="submit">Ingresar</button>
        <div id="login-message" class="message" role="alert"></div>
      </form>
    </section>

    <section id="dashboard" hidden>
      <div class="status-line"><div><h1 style="margin:0">Trámites</h1><span id="count" class="muted"></span></div><button id="refresh" class="btn secondary" type="button">Actualizar</button></div>
      <div class="panel toolbar">
        <div class="field"><label for="search">Buscar</label><input id="search" type="search" placeholder="Código, nombre, correo, WhatsApp o dato del formulario" /></div>
        <div class="field" style="max-width:230px"><label for="status-filter">Estado</label><select id="status-filter"><option value="">Todos</option><option value="awaiting_payment">Pago pendiente</option><option value="payment_review">Pago en revisión</option><option value="payment_confirmed">Pago confirmado</option><option value="in_progress">En proceso</option><option value="needs_info">Falta información</option><option value="finalized">Finalizado</option></select></div>
      </div>
      <div id="dashboard-message" class="message" role="status"></div>
      <div id="requests" class="requests"></div>
    </section>
  </main>
  <script src="services.js?v=20260911-admin-v2"></script>
  <script src="arca-family.js?v=20260911-admin-v2"></script>
  <script src="admin.js?v=20260911-admin-v2"></script>
</body>
</html>
